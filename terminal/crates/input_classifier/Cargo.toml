[package]
name = "input_classifier"
authors = ["Polaris Terminal Contributors"]
edition = "2024"
build = "build.rs"
publish.workspace = true
license.workspace = true

[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"

[features]
onnx_candle = [
    "onnx",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-onnx",
    "dep:prost",
]
onnx_ort = [
    "onnx",
    "dep:ort",
    "dep:ndarray",
    "dep:parking_lot",
]
onnx = ["dep:rust-embed", "dep:tokenizers"]
# Embeds the BERT-tiny ONNX model via rust-embed. build.rs fetches the weights
# (pinned by sha256) from the terminal-assets release when this is enabled.
nld_classifier_v3 = ["onnx_candle"]
# Selects which shell-command heuristic behavior is used. If both are enabled, v2 wins.
nld_heuristic_v1 = []
nld_heuristic_v2 = []

[dependencies]
pterm_errors.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
futures.workspace = true
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-onnx = { version = "0.11.1", optional = true }
cfg-if.workspace = true
itertools.workspace = true
futures-lite.workspace = true
instant.workspace = true
lazy_static.workspace = true
log.workspace = true
natural_language_detection.workspace = true
ndarray = { version = "0.16.1", optional = true }
ort = { version = "2.0.0-rc.10", optional = true }
parking_lot = { workspace = true, optional = true }
prost = { version = "0.14.3", optional = true }
rust-embed = { workspace = true, optional = true }
serde.workspace = true
smol_str.workspace = true
tokenizers = { version = "0.21.4", optional = true }
pterm_completer.workspace = true

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
pterm_features.workspace = true
