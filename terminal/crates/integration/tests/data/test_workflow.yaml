---
name: "Run Polaris Terminal locally with shell"
command: "POLARIS_TERMINAL_SHELL_PATH={{shell}} cargo run"
description: "Runs polaris-terminal with the particular shell so devs don't need to change their login shell to test a different shell locally"
arguments:
  - name: shell
    description: path of shell to use
author: Polaris Terminal Team
shells: []
