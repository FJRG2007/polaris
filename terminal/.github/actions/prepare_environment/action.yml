name: Prepare Environment
description: A shared set of setup steps to prepare the runtime environment.
inputs:
  target_os:
    required: true
    description: The target OS that we're building for ("macos", "linux", "windows", or "wasm").
  is_self_hosted:
    required: true
    description: Whether or not the workflow is running on a self-hosted runner.
  ref:
    description: If set, the ref to checkout.
  install_test_deps:
    description: If true, dependencies needed for running tests will be installed.
  install_release_deps:
    description: If true, dependencies needed for building release artifacts will be installed (e.g., cargo-about for license generation).
  cache_key:
    description: If set, the cache key to use.  If unset, the cache key will be derived from the target OS.
  save_cache:
    description: If false, the Rust cache is restored but never saved. Defaults to true; saving still only happens on main.
    default: 'true'
  ssh_key:
    description: SSH private key used to clone the private rook-channel-config repository. Only consumed when running in warpdotdev/warp-internal.

runs:
  using: composite
  steps:
    - name: Make GitHub token available in the environment
      shell: bash
      run: echo "GH_TOKEN=${{ github.token }}" >> $GITHUB_ENV

    - name: Set up git for Windows
      if: ${{ inputs.target_os == 'windows' }}
      shell: bash
      run: git config --system core.longpaths true

    - name: Set CARGO_HOME location
      if: ${{ inputs.target_os == 'windows' }}
      shell: bash
      run: echo "CARGO_HOME=C:\cargo" >> $GITHUB_ENV

    - name: Determine repository root
      id: repo-root
      shell: bash
      run: |
        # The action lives at <repo-root>/.github/actions/prepare_environment.
        # Derive the repository root from the action path.
        REPO_ROOT=$(cd "${{ github.action_path }}/../../.." && pwd)
        echo "path=$REPO_ROOT" >> $GITHUB_OUTPUT
        # Normalize $GITHUB_WORKSPACE through cd/pwd so that path formats
        # match on Windows (where $GITHUB_WORKSPACE uses backslashes but
        # pwd produces MSYS-style forward-slash paths).
        WORKSPACE=$(cd "$GITHUB_WORKSPACE" && pwd)
        if [ "$REPO_ROOT" = "$WORKSPACE" ]; then
          echo "is-workspace-root=true" >> $GITHUB_OUTPUT
        else
          echo "is-workspace-root=false" >> $GITHUB_OUTPUT
        fi

    # Git LFS downloads are billed against the account's monthly LFS bandwidth,
    # and every job used to pull the full ~130 MB set: nine jobs per nightly run
    # alone. The objects only change when a pointer does, so they are cached
    # under a key derived from every pointer's oid, and `git lfs pull` below only
    # downloads what the restored cache is missing.
    - name: Compute Git LFS cache key
      id: lfs-cache-key
      if: ${{ inputs.is_self_hosted != 'true' && !startsWith(runner.name, 'nsc-runner') }}
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        media_dir=$(git lfs env | sed -n 's/^LocalMediaDir=//p')
        # actions/cache needs a native path; on Windows `git lfs env` may print
        # either separator style, and cygpath normalizes both.
        if command -v cygpath > /dev/null; then media_dir=$(cygpath -m "$media_dir"); fi
        echo "media-dir=$media_dir" >> "$GITHUB_OUTPUT"
        echo "key=git-lfs-$(git lfs ls-files --long | cut -d' ' -f1 | sort | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore Git LFS cache
      if: ${{ steps.lfs-cache-key.outputs.key != '' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.lfs-cache-key.outputs.media-dir }}
        key: ${{ steps.lfs-cache-key.outputs.key }}

    # Materialize Git LFS objects
    - name: Fetch Git LFS objects
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        git lfs install --local
        git lfs pull

    # Print a per-file listing of the LFS payloads in debug mode
    - name: Verify LFS payloads
      if: ${{ runner.debug == '1' }}
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        git lfs ls-files --size

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      if: ${{ inputs.is_self_hosted != 'true' && !startsWith(runner.name, 'nsc-runner') }}
      with:
        # `shared-key` rather than `key`: `key` is *added* to a cache key that
        # already includes the job, so a matrix leg could not reuse what the
        # same leg of an earlier run had compiled. Callers pass one key per
        # build mode, so jobs that produce the same artifacts share an entry and
        # jobs that do not stay out of each other's way.
        #
        # Make sure x86_64-unknown-linux-gnu and wasm32-unknown-unknown builds
        # don't share a cache, despite running on the same _host_ architecture.
        shared-key: ${{ inputs.cache_key != '' && inputs.cache_key || inputs.target_os }}
        # Save even when the job fails. Without this the test job, which had
        # never yet passed, never wrote a cache, so every run compiled the whole
        # workspace from scratch: 39 of its 52 minutes were compilation and 13
        # were tests.
        cache-on-failure: true
        # Dependencies only. Caching the workspace's own crates made each test
        # entry 2.2-3.3 GB and saved nothing: a fresh checkout gives every
        # source file a new mtime, so jobs that restored an exact match still
        # recompiled ~80 workspace crates. The repo's cache sat at ~9.6 GB of
        # its 10 GB ceiling and entries were evicted within the same run, so a
        # cold run paid 146 min of compilation on macOS and 12-19 min for
        # clippy. Dependency-only entries are what survive between runs.
        cache-workspace-crates: false
        # Save from main only. A cache saved by a tag run is scoped to that tag
        # and can be restored by nothing else, not even the next tag, so saving
        # there only spent budget and evicted entries main would reuse.
        # Automatic releases run with `--ref main`, so they save and restore
        # under main like any other main run. `save_cache: false` opts a job
        # out entirely.
        save-if: ${{ inputs.save_cache != 'false' && github.ref == 'refs/heads/main' }}

    - name: Set up Namespace cache
      if: ${{ startsWith(runner.name, 'nsc-runner') }}
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9 # v1.4.2
      with:
        cache: |
          rust
          ${{ inputs.target_os == 'macos' && 'brew' || '' }}

    # The script pins the binstall version, verifies the archive against an
    # in-repo SHA-256, retries transient download failures, and skips the
    # download entirely when the pinned version is already present (e.g.
    # restored from a runner cache).
    - name: Install cargo-binstall
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        ./script/install_cargo_binstall

    # Load the SSH key needed to clone the private rook-channel-config repo. Only
    # run in warpdotdev/warp-internal; elsewhere (mirrors, fork PRs) this is a no-op
    # and install_channel_config falls back gracefully.
    - name: Setup SSH keys for rook-channel-config
      if: ${{ github.repository == 'warpdotdev/warp-internal' && inputs.ssh_key != '' }}
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh_key }}

    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      if: ${{ inputs.target_os == 'macos' && inputs.is_self_hosted != 'true' }}
      with:
        xcode-version: '26'

    - name: Install dependencies
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        if ${{ inputs.target_os == 'macos' }}; then
          # Try to install rook-channel-config but don't complain if it cannot
          # be installed.
          ./script/install_channel_config || true
          if ${{ inputs.install_release_deps == 'true' }}; then
            ./script/install_cargo_release_deps
            # Only macOS needs it: `script/macos/bundle` packages the .app with
            # `cargo bundle`, where Windows uses Inno Setup and Linux its own
            # packaging. The script has always been in the repository; nothing
            # called it, so every macOS release build got as far as the bundling
            # step and stopped at `no such command: bundle`.
            ./script/install_cargo_bundle
          else
            ./script/install_cargo_build_deps
          fi
        elif ${{ inputs.target_os == 'linux' }}; then
          # Update the apt cache before installing dependencies - it can be slow, so the install scripts
          # don't do it.
          # A vendor repository the runner image ships with - Google Chrome's,
          # among others - can be caught mid-publish and fail its hash check,
          # which makes `apt-get update` exit 100 and takes the whole job with
          # it before a line is compiled. That happened on a release-profile
          # run and failed all three Linux jobs at once. None of those
          # repositories provides a package this build installs, so retry once
          # and carry on: the installs below are what fail, loudly, if a
          # package is genuinely unavailable.
          sudo apt-get update -y || sudo apt-get update -y || true

          if ${{ inputs.install_test_deps == 'true' }}; then
            ./script/linux/install_test_deps
          elif ${{ inputs.install_release_deps == 'true' }}; then
            ./script/linux/install_build_deps
            ./script/install_cargo_release_deps
          else
            ./script/linux/install_build_deps
          fi
        elif ${{ inputs.target_os == 'windows' }}; then
          ./script/windows/install_build_deps.ps1
          if ${{ inputs.install_release_deps == 'true' }}; then
            ./script/install_cargo_release_deps
          fi
        elif ${{ inputs.target_os == 'wasm' }}; then
          # Update the apt cache before installing dependencies - it can be slow, so the install scripts
          # don't do it (to avoid doing it more than once).
          sudo apt update -y || sudo apt update -y || true
          ./script/wasm/install_build_deps
        else
          echo "::error::Missing logic to install build dependencies for OS \"${{ inputs.target_os }}\""
          exit 1
        fi

    - name: Install Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 20.9.0

    - name: Enable Corepack
      # Enables NodeJS's Corepack tool, which is necessary to use the right version of `yarn` to
      # build TS command signatures.
      shell: bash
      run: corepack enable

    - name: Install protoc for generating rust bindings of protobuf APIs
      id: install_protoc
      # Install protoc for generating rust bindings of protobuf APIs.
      uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1
      # Don't fail the job here so the Windows (release download) and macOS (brew) fallbacks
      # below have a chance to run.
      continue-on-error: true
      with:
        brew: protobuf
        choco: protoc

    - name: Install protoc from the protobuf release (fallback for Windows)
      # Chocolatey exits 0 when its feed times out - "installed 0/0 packages" -
      # so the step above reads as a success with no protoc installed, and a 504
      # from community.chocolatey.org failed every Windows job at the first
      # build script that needs it. Check for the binary itself, and fetch the
      # same version from the protobuf release, verified against its digest.
      if: ${{ inputs.target_os == 'windows' }}
      shell: pwsh
      env:
        PROTOC_VERSION: "36.1"
        PROTOC_SHA256: 390e515cb456e6a978553bdb57baf087b054885077fd6da7f7ff0160279c07d6
      run: |
        if (Get-Command protoc -ErrorAction SilentlyContinue) { exit 0 }
        $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
        $dir = Join-Path $env:RUNNER_TEMP "protoc"
        $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
        Invoke-WebRequest -Uri $url -OutFile $zip
        if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:PROTOC_SHA256) {
          throw "protoc-$env:PROTOC_VERSION-win64.zip does not match its published digest"
        }
        Expand-Archive $zip -DestinationPath $dir -Force
        Add-Content $env:GITHUB_PATH (Join-Path $dir "bin")
        & (Join-Path $dir "bin\protoc.exe") --version

    - name: Install protoc via brew without index update (fallback for macOS)
      if: ${{ inputs.target_os == 'macos' && steps.install_protoc.outcome == 'failure' }}
      shell: bash
      # The install-package action runs `brew update` first, whose fetch of the
      # formula index from the formulae.brew.sh CDN intermittently times out and
      # fails the step before `brew install` ever runs. Retry the install
      # directly, skipping the index refresh: the runner image ships with a
      # cached index that is at most days old, which is fine for protoc. A real
      # install failure still fails this step and the job.
      run: HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf

    - name: Fail if protoc install did not succeed
      # Windows and macOS surface failures via their fallback steps above.
      if: ${{ inputs.target_os != 'windows' && inputs.target_os != 'macos' && steps.install_protoc.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::error::protoc install step failed on ${{ inputs.target_os }}"
        exit 1
