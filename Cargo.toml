# Polaris workspace.
# The Rust side of Polaris: the privileged host daemon.
[workspace]
resolver = "2"
members = [
    "crates/polaris-hostd",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/FJRG2007/polaris"
authors = ["FJRG2007"]

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

# Small, static on-device binaries: optimize for size over raw speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
