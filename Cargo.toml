# Polaris workspace.
# The Rust side of Polaris: the privileged host daemon, the tunnel daemon, and
# the shared core (docs/rust-core-plan.md) with its Node and WebAssembly bindings.
[workspace]
resolver = "2"
members = [
    "crates/polaris-hostd",
    "crates/polaris-tunnel",
    "crates/polaris-core",
    "crates/polaris-core-vectors",
    "crates/polaris-core-node",
    "crates/polaris-core-wasm",
]
exclude = ["vendor/smoltcp"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/FJRG2007/polaris"
authors = ["FJRG2007"]

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

# smoltcp 0.12.0 with two changes to its TCP retransmission timer, both in
# src/socket/tcp.rs: three retransmissions in a row no longer double the RTT
# estimate (after an outage it sat at 10 s, so every later loss stalled the
# connection for 10 s and a held game connection never caught up), and the
# retransmission backoff stops growing at 10 s. Upstream dropped the doubling
# too; drop this patch once the crate moves to a release that has the fix.
[patch.crates-io]
smoltcp = { path = "vendor/smoltcp" }

# Small, static on-device binaries: optimize for size over raw speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The Node binding is loaded into a long-lived process (the dashboard server,
# Electron main). A panic there must unwind into a JavaScript error the facade
# can fall back from, not abort the whole process, so it is built with this
# profile instead of `release`. Speed over size: it is not shipped to browsers.
[profile.release-node]
inherits = "release"
panic = "unwind"
opt-level = 3

# The WebAssembly binding is downloaded by browsers, so it keeps `release`'s
# size optimisation; wasm32 traps on panic regardless of this setting.
[profile.release-wasm]
inherits = "release"
