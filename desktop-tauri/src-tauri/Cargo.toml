[package]
name = "polaris-desktop-beta"
version = "0.0.1"
description = "Polaris desktop, Tauri beta. Not released: the Electron app in desktop/ is the shipped one."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
polaris-client = { path = "../polaris-client" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
