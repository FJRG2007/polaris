[package]
name = "polaris-desktop-beta"
version = "0.0.1"
description = "Polaris desktop, Tauri beta. Not released: the Electron app in desktop/ is the shipped one."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# A hidden, timed start for desktop-tauri/tools/measure-startup. Never in a build
# anybody runs.
measure = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
polaris-client = { path = "../polaris-client" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sysinfo = { version = "=0.40.3", default-features = false, features = ["system"] }
tauri = { version = "=2.12.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tokio = { version = "=1.54.1", features = ["sync", "time", "fs"] }
tokio-util = "=0.7.20"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
# WebView2 events Tauri does not expose: permission requests, failed loads and
# certificate errors. The versions wry 0.57 itself uses.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
winreg = "=0.56.0"
