[package]
name = "polaris-client"
version = "0.1.0"
description = "Talking to a Polaris instance from a native client: addresses, identity probe and the API-key calls."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "=0.11.1"
base64 = "=0.23.1"
curve25519-dalek = "=5.0.0"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
hkdf = "=0.13.0"
mdns-sd = "=0.21.7"
rsa = { version = "=0.10.0", features = ["pkcs1v15"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "=0.6.5"
