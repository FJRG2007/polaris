<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Polaris Beta</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main>
            <h1 data-text="connect.title">Your Polaris servers</h1>
            <nav id="tabs" class="tabs" role="tablist" aria-label="Settings" data-text-label="settings.tabs" hidden>
                <button id="tab-servers" type="button" role="tab" aria-selected="true" aria-controls="servers-page" data-text="settings.tab-servers"></button>
                <button id="tab-general" type="button" role="tab" aria-selected="false" aria-controls="general-page" data-text="settings.tab-general"></button>
                <button id="tab-advanced" type="button" role="tab" aria-selected="false" aria-controls="advanced-page" data-text="settings.tab-advanced"></button>
            </nav>
            <p id="failure" class="problem" role="alert" hidden></p>
            <section id="servers-page" role="tabpanel">
            <p id="load-error" class="problem" role="alert" hidden></p>
            <ul id="servers" aria-label="Servers" data-text-label="connect.servers"></ul>
            <p id="empty" data-text="connect.empty" hidden>Add the address of your Polaris to open it here.</p>
            <form id="connect" novalidate>
                <h2 data-text="connect.add">Add a server</h2>
                <label for="address" data-text="connect.address">Address *</label>
                <input id="address" name="address" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://polaris.example.com" required autofocus />
                <p id="check" class="hint" aria-live="polite" hidden></p>
                <label for="name" data-text="connect.name">Name</label>
                <input id="name" name="name" type="text" maxlength="40" placeholder="Shown instead of the address" data-text-placeholder="connect.name-hint" />
                <p id="problem" class="problem" role="alert" hidden></p>
                <button id="open" type="submit" data-text="connect.submit">Add and open</button>
            </form>
            <section id="share" aria-labelledby="share-title">
                <h2 id="share-title" data-text="connect.share">Share the list</h2>
                <button id="copy" type="button" class="quiet" data-text="connect.copy">Copy the list</button>
                <button id="save-file" type="button" class="quiet" data-text="connect.save-file">Save to a file</button>
                <button id="open-file" type="button" class="quiet" data-text="connect.open-file">Add from a file</button>
                <button id="show-qr" type="button" class="quiet" data-text="connect.qr">Show as a QR code</button>
                <svg id="qr" role="img" aria-label="The list as a QR code" data-text-label="connect.qr-label" hidden><path id="qr-path" /></svg>
                <label for="paste" data-text="connect.paste">Paste a list</label>
                <textarea id="paste" rows="2" spellcheck="false" placeholder="A list copied from another computer" data-text-placeholder="connect.paste-label"></textarea>
                <button id="import" type="button" class="quiet" data-text="connect.import">Add these servers</button>
                <p id="shared" class="hint" role="status" hidden></p>
            </section>
            </section>
            <section id="general-page" role="tabpanel" hidden>
                <label class="setting">
                    <span class="setting-text">
                        <span class="name" data-text="settings.open-at-login"></span>
                        <span class="hint" data-text="settings.open-at-login-hint"></span>
                    </span>
                    <input id="open-at-login" type="checkbox" role="switch" />
                </label>
                <label class="setting">
                    <span class="setting-text">
                        <span class="name" data-text="settings.start-minimized"></span>
                        <span class="hint" data-text="settings.start-minimized-hint"></span>
                    </span>
                    <input id="start-minimized" type="checkbox" role="switch" />
                </label>
                <label class="setting">
                    <span class="setting-text">
                        <span class="name" data-text="settings.minimize-to-tray"></span>
                        <span class="hint" data-text="settings.minimize-to-tray-hint"></span>
                    </span>
                    <input id="minimize-to-tray" type="checkbox" role="switch" />
                </label>
                <label class="setting">
                    <span class="setting-text">
                        <span class="name" data-text="settings.voice-widget"></span>
                        <span class="hint" data-text="settings.voice-widget-hint"></span>
                    </span>
                    <input id="voice-widget" type="checkbox" role="switch" />
                </label>
                <label class="setting">
                    <span class="setting-text">
                        <span class="name" data-text="settings.game-only"></span>
                        <span class="hint" data-text="settings.game-only-hint"></span>
                    </span>
                    <input id="voice-widget-game-only" type="checkbox" role="switch" />
                </label>
                <div class="row">
                    <p id="version" class="hint"></p>
                    <button id="check-updates" type="button" class="quiet" data-text="settings.check-updates"></button>
                </div>
                <p id="update-status" class="hint" role="status" aria-live="polite"></p>
            </section>
            <section id="advanced-page" role="tabpanel" hidden>
                <label class="setting">
                    <span class="setting-text">
                        <span class="name" data-text="settings.hardware"></span>
                        <span class="hint" data-text="settings.hardware-hint"></span>
                    </span>
                    <input id="hardware-acceleration" type="checkbox" role="switch" />
                </label>
                <div id="restart-pending" class="row" hidden>
                    <p class="hint" data-text="settings.restart-applies"></p>
                    <button id="restart-pending-now" type="button" data-text="settings.restart-now"></button>
                </div>
            </section>
            <dialog id="confirm-restart" aria-labelledby="restart-title" aria-describedby="restart-body">
                <p id="restart-title" class="name" data-text="settings.restart-title"></p>
                <p id="restart-body" class="hint" data-text="settings.restart-body"></p>
                <p id="restart-failure" class="problem" role="alert" hidden></p>
                <div class="row end">
                    <button id="restart-later" type="button" class="quiet" data-text="settings.later"></button>
                    <button id="restart-now" type="button" data-text="settings.restart-now"></button>
                </div>
            </dialog>
            <button id="close" type="button" class="quiet" data-text="connect.back" hidden>Back to Polaris</button>
        </main>
        <script src="i18n.js"></script>
        <script src="main.js"></script>
    </body>
</html>
