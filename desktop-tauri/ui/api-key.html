<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>API key - Polaris</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="api-key.js" defer></script>
    </head>
    <body>
        <main>
            <h1>An API key for pushing</h1>
            <p>Pushing from this computer calls <span id="server">your Polaris</span> with an API key that may manage deploys. You paste it once.</p>
            <form id="form" novalidate>
                <label for="key">API key *</label>
                <input id="key" name="key" type="password" autocomplete="off" spellcheck="false" placeholder="plk_..." aria-describedby="key-note" autofocus />
                <button id="reveal" type="button" aria-controls="key">Show</button>
                <p id="key-note">Kept encrypted by this computer's password store.</p>
                <p id="problem" role="alert" hidden></p>
                <p>No key yet? <button id="open-keys" type="button">Create one in Account &gt; API keys</button></p>
                <button id="cancel" type="button">Cancel</button>
                <button id="submit" type="submit" aria-disabled="true">Save key</button>
            </form>
        </main>
    </body>
</html>
