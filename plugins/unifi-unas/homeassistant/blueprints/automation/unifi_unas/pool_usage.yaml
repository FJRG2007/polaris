blueprint:
  name: UniFi UNAS - storage pool almost full
  description: Run actions when a storage pool's usage passes a percentage.
  domain: automation
  input:
    usage_sensors:
      name: Pool usage sensors
      selector:
        entity:
          multiple: true
          filter:
            - integration: unifi_unas
              domain: sensor
    threshold:
      name: Above (%)
      default: 85
      selector:
        number:
          min: 50
          max: 99
          unit_of_measurement: "%"
    actions:
      name: Actions
      selector:
        action: {}
triggers:
  - trigger: numeric_state
    entity_id: !input usage_sensors
    above: !input threshold
actions: !input actions
mode: queued
