blueprint:
  name: UniFi UNAS - disk temperature
  description: Run actions when a disk stays above a temperature.
  domain: automation
  input:
    temperature_sensors:
      name: Temperature sensors
      description: The Hottest Disk sensor, or individual bay temperatures.
      selector:
        entity:
          multiple: true
          filter:
            - integration: unifi_unas
              domain: sensor
              device_class: temperature
    threshold:
      name: Above (C)
      default: 50
      selector:
        number:
          min: 30
          max: 80
          unit_of_measurement: "C"
    minutes:
      name: For (minutes)
      default: 10
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    actions:
      name: Actions
      selector:
        action: {}
triggers:
  - trigger: numeric_state
    entity_id: !input temperature_sensors
    above: !input threshold
    for:
      minutes: !input minutes
actions: !input actions
mode: queued
