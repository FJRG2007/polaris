blueprint:
  name: UniFi UNAS - unexpected sign-in
  description: >-
    Run actions when someone opens an SMB session as a user, or from an
    address, that is not on the expected lists.
  domain: automation
  input:
    sign_in_event:
      name: Sign-in event
      selector:
        entity:
          filter:
            - integration: unifi_unas
              domain: event
    expected_users:
      name: Expected users
      description: Left empty, every SMB sign-in counts as unexpected.
      default: []
      selector:
        text:
          multiple: true
    expected_ips:
      name: Expected IP addresses
      description: Left empty, the address is not checked.
      default: []
      selector:
        text:
          multiple: true
    actions:
      name: Actions
      description: "Who and from where: {{ trigger.to_state.attributes.username }} / {{ trigger.to_state.attributes.ip }}."
      selector:
        action: {}
variables:
  expected_users: !input expected_users
  expected_ips: !input expected_ips
triggers:
  - trigger: state
    entity_id: !input sign_in_event
    not_from: unavailable
conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state.attributes.event_type == 'smb_session_started'
         and (trigger.to_state.attributes.username not in expected_users
              or (expected_ips | length > 0 and trigger.to_state.attributes.ip not in expected_ips)) }}
actions: !input actions
mode: queued
