blueprint:
  name: UniFi UNAS - storage or backup problem
  description: >-
    Run actions when any chosen problem sensor turns on: a pool with no data
    protection, a bay whose disk is not Optimal, a scrub that found errors,
    or a backup task that failed or is overdue.
  domain: automation
  input:
    problem_sensors:
      name: Problem sensors
      selector:
        entity:
          multiple: true
          filter:
            - integration: unifi_unas
              domain: binary_sensor
              device_class: problem
    actions:
      name: Actions
      description: "The sensor that fired is available as {{ trigger.entity_id }}."
      selector:
        action: {}
triggers:
  - trigger: state
    entity_id: !input problem_sensors
    from: "off"
    to: "on"
actions: !input actions
mode: queued
