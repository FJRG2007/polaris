name: Publish dashboard image

# Build and push the dashboard images to GHCR on every change to main, keeping
# only the `latest` tag (no versioned tags). Installs then pull instead of
# building from source. The packages must be made public once in GitHub
# (Settings -> Packages -> change visibility) so unauthenticated pulls work.
#
# Each image is its own job, gated on whether its sources actually changed, so a
# web-only push does not rebuild the multi-arch Rust host daemon (the slowest
# step by far). Jobs also run in parallel, so wall-clock is the slowest single
# image, not the sum of them all.
#
# An image is also gated on its suite passing. `latest` is what every deployment
# pulls, and the update card offers whatever commit that tag was built from - so
# publishing from a commit whose tests failed is how a broken build reaches every
# box that presses Update. The suites are called here rather than watched for:
# they run standalone on every push to a branch or a pull request (that is the
# signal there), and on main this call is the only run of them.
#
# The gate is on the TAG, not on the build. An image whose sources changed starts
# building the moment the push lands, beside the suites rather than behind them,
# and is pushed to the registry by digest with no tag on it. Nothing resolves a
# digest nobody was told about: `update.sh` asks for `:latest`, and only the `tag`
# job at the end moves that tag, only once the suites are green. So the guarantee is
# the one above, and the build no longer waits four minutes to learn something that
# has nothing to do with whether it compiles. A digest that never gets tagged is
# cleaned up by ghcr-prune.yml, which keeps only what `latest` resolves to.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/apps/**"
      - "dashboard/packages/**"
      - "dashboard/cli/**"
      - "dashboard/patches/**"
      - "dashboard/scripts/**"
      - "dashboard/docker/**"
      - "dashboard/mdns/**"
      - "dashboard/services/messaging-bridge/**"
      - "dashboard/services/edge-guard/**"
      - "dashboard/services/camera-relay/**"
      - "dashboard/services/vision/**"
      - "dashboard/services/face/**"
      - "dashboard/package.json"
      - "dashboard/package-lock.json"
      - "crates/polaris-hostd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/dashboard-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One publish at a time. An image is now pushed untagged and named minutes later by
# the `tag` job, so two overlapping runs interleave: the older one's `tag` can land
# after the newer one's and move `latest` back to the commit before it. Cancellation
# stays off - a run stopped between the push and the tag leaves images in the
# registry that nothing will ever name.
concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  # Decide which images need rebuilding from the paths that changed in this push.
  # A workflow_dispatch, an unknown base, or a change to this file rebuilds all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mdns: ${{ steps.filter.outputs.mdns }}
      hostd: ${{ steps.filter.outputs.hostd }}
      updater: ${{ steps.filter.outputs.updater }}
      bridge: ${{ steps.filter.outputs.bridge }}
      guard: ${{ steps.filter.outputs.guard }}
      relay: ${{ steps.filter.outputs.relay }}
      vision: ${{ steps.filter.outputs.vision }}
      face: ${{ steps.filter.outputs.face }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          all() { out web true; out mdns true; out hostd true; out updater true; out bridge true; out guard true; out relay true; out vision true; out face true; }
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all; exit 0
          fi
          CHANGED="$RUNNER_TEMP/changed.txt"
          git diff --name-only "$BEFORE" "$SHA" > "$CHANGED"
          echo "Changed files ($(wc -l < "$CHANGED")):"; head -100 "$CHANGED"
          # Matched against a file rather than through a pipe. `grep -q` stops at
          # its first hit and closes the pipe; under `pipefail` the EPIPE that
          # hands the writer becomes the pipeline's status, so `has` returned
          # false for a pattern it had just matched. It only bites once the list
          # outgrows the 64K pipe buffer - a push of a few files always fit, and
          # the first one that did not reported every filter as "nothing changed"
          # and published no image at all.
          has() { grep -qE "$1" "$CHANGED"; }
          if has '^\.github/workflows/dashboard-publish\.yml$'; then all; exit 0; fi
          has '^dashboard/(apps|packages|cli|patches|scripts)/|^dashboard/docker/(Dockerfile|entrypoint\.sh)|^dashboard/package(-lock)?\.json$' && out web true || out web false
          has '^dashboard/mdns/' && out mdns true || out mdns false
          has '^crates/polaris-hostd/|^Cargo\.(toml|lock)$' && out hostd true || out hostd false
          has '^dashboard/docker/updater/' && out updater true || out updater false
          has '^dashboard/services/messaging-bridge/|^dashboard/packages/messaging/|^dashboard/package(-lock)?\.json$' && out bridge true || out bridge false
          # The guard bundles @polaris/core, so a change there is a change to the guard.
          has '^dashboard/services/edge-guard/|^dashboard/packages/core/|^dashboard/package(-lock)?\.json$' && out guard true || out guard false
          # The relay is go2rtc plus an entrypoint; nothing else feeds it.
          has '^dashboard/services/camera-relay/' && out relay true || out relay false
          # The worker bundles part of @polaris/core - the zone geometry, the
          # detector's decoder and the tracker - so a change to those is a change
          # to the worker. The whole of core was the pattern here, and core is
          # where everything else in the dashboard lives too: editing a task
          # schema rebuilt the vision worker, which is a multi-arch build that
          # emulates arm64 and takes eight minutes when it works.
          #
          # Narrowed to `camera-*` because those four modules import nothing from
          # core but each other - checked, and the reason this is safe rather
          # than merely cheaper. The barrel and the packaging go in too, since a
          # change to either changes what the bundle resolves.
          has '^dashboard/services/vision/|^dashboard/packages/core/src/camera-|^dashboard/packages/core/(package\.json|tsconfig\.json|src/index\.ts)$|^dashboard/package(-lock)?\.json$' && out vision true || out vision false
          # The recognizer is one Python file, its pins, and the weights the
          # Dockerfile bakes in.
          has '^dashboard/services/face/' && out face true || out face false

  # The gates. Skipped when nothing they cover is being rebuilt, which also skips
  # the image jobs that need them - they would have been skipped by their own
  # filter anyway.
  dashboard-ci:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.bridge == 'true' || needs.changes.outputs.guard == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/dashboard-ci.yml
    with:
      # The web image builds the same app from the same commit; building it twice
      # proves nothing the image build does not already prove.
      skip_app: true

  rust-ci:
    needs: changes
    if: ${{ needs.changes.outputs.hostd == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/ci.yml

  # Next.js dashboard. amd64 only (the runtime servers are x86). Layer caching in
  # the Dockerfile keeps `npm ci` cached across source-only changes.
  #
  # The build cache lives in the registry rather than in the Actions cache. What it
  # holds is the installed workspace - a single 895 MB layer - and pushing that
  # through the Actions cache API cost a minute and a half of "exporting to GitHub
  # Actions Cache" on every run, plus forty seconds to read it back. The registry is
  # where this job is already authenticated and already pushing. It is also a cache
  # that does not compete with five other scopes for the repository's 10 GB Actions
  # cache allowance, where an eviction turns the next build cold with no warning.
  #
  # A separate package, deliberately: ghcr-prune.yml keeps only what each package's
  # `latest` tag resolves to, so a cache tag parked inside polaris-dashboard would be
  # deleted after every publish. polaris-buildcache is not in its list.
  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/docker/Dockerfile
          build-args: |
            POLARIS_BUILD_SHA=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:web
          cache-to: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:web,mode=max
          outputs: type=image,name=ghcr.io/fjrg2007/polaris-dashboard,push-by-digest=true,name-canonical=true,push=true
          # No attestation manifests. buildx attaches one to the index by
          # default, and it is an extra untagged child that every puller then has
          # to resolve: a daemon on the containerd image store fetches the whole
          # index, and a deployment was left unable to upgrade with "content
          # digest ... not found" pointing at exactly that child while the two
          # real platform manifests were fine. Nothing here reads the provenance,
          # so the index carries the two images and nothing else.
          provenance: false
          sbom: false

  mdns:
    needs: changes
    if: ${{ needs.changes.outputs.mdns == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dashboard/mdns
          push: true
          tags: ghcr.io/fjrg2007/polaris-mdns:latest
          cache-from: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:mdns
          cache-to: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:mdns,mode=max

  # Privileged host daemon (Rust workspace at the repo root). Built per-arch on
  # NATIVE runners - amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm - instead of
  # emulating arm64 under QEMU (which made this the ~7-minute bottleneck). Each arch
  # pushes by digest; the manifest job below stitches them into the :latest tag,
  # and that is where the Rust suites are waited on - the same arrangement as the
  # dashboard images. Nothing pulls a digest, so building one before the suites
  # have spoken commits to nothing.
  hostd:
    needs: changes
    if: ${{ needs.changes.outputs.hostd == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/polaris-hostd/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:hostd-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:hostd-${{ matrix.arch }},mode=max
          outputs: type=image,name=ghcr.io/fjrg2007/polaris-hostd,push-by-digest=true,name-canonical=true,push=true
          # No attestation manifests. buildx attaches one to the index by
          # default, and it is an extra untagged child that every puller then has
          # to resolve: a daemon on the containerd image store fetches the whole
          # index, and a deployment was left unable to upgrade with "content
          # digest ... not found" pointing at exactly that child while the two
          # real platform manifests were fine. Nothing here reads the provenance,
          # so the index carries the two images and nothing else.
          provenance: false
          sbom: false
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: hostd-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  # Stitch the per-arch digests into the multi-arch :latest manifest, once the Rust
  # suites have passed. A failed `rust-ci` skips this job, which leaves both arch
  # digests in the registry with no tag pointing at them - unreachable, and cleaned
  # up by ghcr-prune.yml.
  hostd-manifest:
    needs: [changes, rust-ci, hostd]
    if: ${{ needs.changes.outputs.hostd == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: hostd-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t ghcr.io/fjrg2007/polaris-hostd:latest \
            $(printf 'ghcr.io/fjrg2007/polaris-hostd@sha256:%s ' *)

  # One-shot self-update runner spawned by hostd's /v1/update.
  updater:
    needs: changes
    if: ${{ needs.changes.outputs.updater == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dashboard/docker/updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fjrg2007/polaris-updater:latest
          cache-from: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:updater
          cache-to: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:updater,mode=max

  # Messaging bridge sidecar. The marketplace installs this image as a managed
  # Deploy app (it is not part of the web image), so it must be published for
  # installs to pull. amd64 only, matching the runtime servers. Its build context
  # is the dashboard root so the workspace and @polaris/messaging are available.
  bridge:
    needs: changes
    if: ${{ needs.changes.outputs.bridge == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/services/messaging-bridge/Dockerfile
          cache-from: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:bridge
          cache-to: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:bridge,mode=max
          outputs: type=image,name=ghcr.io/fjrg2007/polaris-messaging-bridge,push-by-digest=true,name-canonical=true,push=true
          # No attestation manifests. buildx attaches one to the index by
          # default, and it is an extra untagged child that every puller then has
          # to resolve: a daemon on the containerd image store fetches the whole
          # index, and a deployment was left unable to upgrade with "content
          # digest ... not found" pointing at exactly that child while the two
          # real platform manifests were fine. Nothing here reads the provenance,
          # so the index carries the two images and nothing else.
          provenance: false
          sbom: false

  # WAF sidecar that sits at each server's edge. Published for the same reason the
  # bridge is: it was build-only, so an update pulled a newer dashboard and left the
  # guard at whatever was built on install day. The two have to move together - the
  # dashboard writes edge routes that name the guard's listeners.
  guard:
    needs: changes
    if: ${{ needs.changes.outputs.guard == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/services/edge-guard/Dockerfile
          cache-from: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:guard
          cache-to: type=registry,ref=ghcr.io/fjrg2007/polaris-buildcache:guard,mode=max
          outputs: type=image,name=ghcr.io/fjrg2007/polaris-edge-guard,push-by-digest=true,name-canonical=true,push=true
          # No attestation manifests. buildx attaches one to the index by
          # default, and it is an extra untagged child that every puller then has
          # to resolve: a daemon on the containerd image store fetches the whole
          # index, and a deployment was left unable to upgrade with "content
          # digest ... not found" pointing at exactly that child while the two
          # real platform manifests were fine. Nothing here reads the provenance,
          # so the index carries the two images and nothing else.
          provenance: false
          sbom: false

  # The camera relay: go2rtc with credentials on its API, which the stock image
  # has no way to arrive with. Published rather than built on the operator's
  # machine so a house does not build a media server the first time somebody adds
  # a camera.
  relay:
    needs: changes
    if: ${{ needs.changes.outputs.relay == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/services/camera-relay/Dockerfile
          # A camera can be on an arm board at the far end of the house, so the
          # relay follows the servers people actually have.
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/fjrg2007/polaris-camera-relay,push-by-digest=true,name-canonical=true,push=true
          # No attestation manifests. buildx attaches one to the index by
          # default, and it is an extra untagged child that every puller then has
          # to resolve: a daemon on the containerd image store fetches the whole
          # index, and a deployment was left unable to upgrade with "content
          # digest ... not found" pointing at exactly that child while the two
          # real platform manifests were fine. Nothing here reads the provenance,
          # so the index carries the two images and nothing else.
          provenance: false
          sbom: false

  # The vision worker: ffmpeg and one bundled file. Published so a house does not
  # build a video pipeline the first time somebody asks a camera to watch for
  # people.
  vision:
    needs: changes
    if: ${{ needs.changes.outputs.vision == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/services/vision/Dockerfile
          # Detection is the work most likely to be sent to a small board in a
          # cupboard, so it follows the servers people actually have.
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/fjrg2007/polaris-vision,push-by-digest=true,name-canonical=true,push=true
          # No attestation manifests. buildx attaches one to the index by
          # default, and it is an extra untagged child that every puller then has
          # to resolve: a daemon on the containerd image store fetches the whole
          # index, and a deployment was left unable to upgrade with "content
          # digest ... not found" pointing at exactly that child while the two
          # real platform manifests were fine. Nothing here reads the provenance,
          # so the index carries the two images and nothing else.
          provenance: false
          sbom: false

  # The recognizer. Its own image because the alternative was telling people to go
  # and run a five-container stack by hand, which is not something Home can install
  # from a button. Heavier than the rest - it carries onnxruntime and the model
  # weights - and rebuilt only when its own directory changes.
  face:
    needs: changes
    if: ${{ needs.changes.outputs.face == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/services/face/Dockerfile
          # Same reach as the worker: this is the other half of the same job, and
          # a house that runs detection on a small board will want to run
          # recognition beside it rather than send frames across the network.
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/fjrg2007/polaris-face,push-by-digest=true,name-canonical=true,push=true
          # No attestation manifests. buildx attaches one to the index by
          # default, and it is an extra untagged child that every puller then has
          # to resolve: a daemon on the containerd image store fetches the whole
          # index, and a deployment was left unable to upgrade with "content
          # digest ... not found" pointing at exactly that child while the two
          # real platform manifests were fine. Nothing here reads the provenance,
          # so the index carries the two images and nothing else.
          provenance: false
          sbom: false

  # The gate. The images above are already in the registry by the time this
  # runs; what it does is give them the name every deployment pulls, and only if the
  # suites passed. Each image is tagged on its own result, so a bridge that failed to
  # build does not hold back a web that did.
  #
  # `!cancelled()` rather than `always()`: a cancelled run must leave `latest` where
  # it is, and a skipped dashboard-ci (nothing here was rebuilt) skips this too,
  # since its result is then not 'success'.
  tag:
    needs: [dashboard-ci, web, bridge, guard, relay, vision, face]
    if: ${{ !cancelled() && needs.dashboard-ci.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the dashboard
        if: ${{ needs.web.result == 'success' }}
        run: |
          docker buildx imagetools create -t ghcr.io/fjrg2007/polaris-dashboard:latest \
            ghcr.io/fjrg2007/polaris-dashboard@${{ needs.web.outputs.digest }}
      - name: Tag the messaging bridge
        if: ${{ needs.bridge.result == 'success' }}
        run: |
          docker buildx imagetools create -t ghcr.io/fjrg2007/polaris-messaging-bridge:latest \
            ghcr.io/fjrg2007/polaris-messaging-bridge@${{ needs.bridge.outputs.digest }}
      - name: Tag the edge guard
        if: ${{ needs.guard.result == 'success' }}
        run: |
          docker buildx imagetools create -t ghcr.io/fjrg2007/polaris-edge-guard:latest \
            ghcr.io/fjrg2007/polaris-edge-guard@${{ needs.guard.outputs.digest }}
      - name: Tag the camera relay
        if: ${{ needs.relay.result == 'success' }}
        run: |
          docker buildx imagetools create -t ghcr.io/fjrg2007/polaris-camera-relay:latest \
            ghcr.io/fjrg2007/polaris-camera-relay@${{ needs.relay.outputs.digest }}
      - name: Tag the vision worker
        if: ${{ needs.vision.result == 'success' }}
        run: |
          docker buildx imagetools create -t ghcr.io/fjrg2007/polaris-vision:latest             ghcr.io/fjrg2007/polaris-vision@${{ needs.vision.outputs.digest }}
      - name: Tag the face recognizer
        if: ${{ needs.face.result == 'success' }}
        run: |
          docker buildx imagetools create -t ghcr.io/fjrg2007/polaris-face:latest             ghcr.io/fjrg2007/polaris-face@${{ needs.face.outputs.digest }}
