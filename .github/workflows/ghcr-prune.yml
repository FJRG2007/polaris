name: Prune published images

# Every push of a tag leaves the manifest it replaced behind as an untagged
# version, and those pile up forever: the registry keeps them, nothing pulls
# them, and they still count against the account. This deletes them, so each
# package holds what its live tags resolve to now and nothing else. That is
# `latest` for the shipped images, and one tag per image for the build cache.
#
# It runs after a publish rather than inside it: the publish only rebuilds the
# images whose sources changed, and the versions left behind are worth clearing
# for every package either way. A failure here also cannot turn a successful
# publish red, which is right - this is housekeeping, not delivery.
#
# What is never deleted: the version carrying the `latest` tag, and every digest
# that version references. A multi-arch image is an index whose per-architecture
# manifests are themselves untagged, and a build attestation is another untagged
# child - deleting those would leave `latest` pointing at manifests the registry
# no longer holds, which breaks the pull for everyone. When the tag cannot be
# read at all the package is skipped rather than guessed at.
#
# Nor is anything pushed in the last hour. The publish pushes each image by digest
# and names it minutes later, once the suites are green, so a digest with no tag on
# it is as likely to be a build waiting for its name as a build that lost it - and
# this run's picture of what `latest` resolves to is a snapshot taken before the
# other run moved it. An hour is longer than any publish takes; what it protects
# stops being protected on the next run.
#
# A rollback is not affected: update.sh returns to the image already on the box,
# it does not fetch the old digest again. An installation that has lost its local
# copy moves to `latest` instead, which is what "no history" means here.

on:
  workflow_run:
    workflows: ["Publish dashboard image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Two prunes at once would read one tag while the other deletes, so they queue.
concurrency:
  group: ghcr-prune
  cancel-in-progress: false

jobs:
  prune:
    # A publish that failed may have pushed nothing, and a cancelled one may have
    # been interrupted mid-push; neither is a safe moment to decide what is unused.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete every version nothing points at
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run }}
          # The shipped images: `latest` is the only tag any of them carries, so
          # everything else in the package is a build it replaced.
          PACKAGES: >-
            polaris-dashboard
            polaris-mdns
            polaris-hostd
            polaris-updater
            polaris-messaging-bridge
            polaris-edge-guard
          # The buildkit cache, pruned by the other rule below. Its tags (web,
          # guard, hostd-amd64, ...) are none of them `latest` and all of them
          # live, so keeping only what `latest` names would delete the cache after
          # every publish and make the next build of each image a cold one. What
          # does pile up here is the manifest each `cache-to` push leaves behind
          # when it moves its tag: untagged, one per image per build, and nothing
          # else was ever going to collect it.
          CACHE_PACKAGES: polaris-buildcache
        run: |
          set -uo pipefail
          repo=$(echo "$OWNER" | tr "[:upper:]" "[:lower:]")
          failed=0
          removed=0
          # Anything newer than this belongs to a publish that may still be running.
          cutoff=$(date -u -d "-60 minutes" +%s)

          # Deleting is a write like any other, and a backlog is thousands of them
          # in a row - which is what the registry throttles rather than refuses,
          # answering 403 with a rate-limit body. That answer is worth waiting out;
          # any other one is a real refusal and is reported straight away.
          delete_version() {
            attempt=1
            while :; do
              answer=$(gh api -X DELETE "$1" 2>&1) && return 0
              case "$answer" in
                *"rate limit"*|*"429"*|*"abuse"*) ;;
                *) echo "$answer"; return 1;;
              esac
              [ "$attempt" -ge 3 ] && { echo "still throttled after $attempt tries"; return 1; }
              sleep $((attempt * 30))
              attempt=$((attempt + 1))
            done
          }

          for package in $PACKAGES $CACHE_PACKAGES; do
            echo "::group::$package"
            case " $CACHE_PACKAGES " in *" $package "*) cache=true;; *) cache=false;; esac

            keep=""
            if [ "$cache" = false ]; then
              # The tag as the registry resolves it now. Everything it names is
              # load-bearing; anything else in the package is a replaced build.
              index=$(docker buildx imagetools inspect "ghcr.io/$repo/$package:latest" --raw 2>/dev/null)
              if [ -z "$index" ]; then
                echo "no latest tag to read - skipped rather than guessed at"
                echo "::endgroup::"
                continue
              fi
              keep=$(echo "$index" | jq -r '.manifests[]?.digest')
              echo "latest references $(echo "$keep" | grep -c . || true) manifest(s)"
            fi
            refused=0

            # created_at before the tags: with a tab IFS the shell collapses the
            # empty field an untagged version writes, so a column after it would
            # be read as the tags of a version that has none.
            if ! versions=$(gh api --paginate "/users/$OWNER/packages/container/$package/versions" \
              --jq '.[] | [.id, .name, .created_at, ((.metadata.container.tags // []) | join(","))] | @tsv' 2>&1); then
              # A package nobody has published yet has nothing to prune, and is
              # not a reason to hold the run red until it exists.
              case "$versions" in
                *"404"*) echo "not published yet" ;;
                *) echo "could not list versions: $versions"; failed=1 ;;
              esac
              echo "::endgroup::"
              continue
            fi

            while IFS=$'\t' read -r id digest created tags; do
              [ -n "${id:-}" ] || continue
              if [ "$cache" = true ]; then
                # Every tag this package carries is a cache another build reads.
                [ -z "${tags:-}" ] || continue
              else
                case ",${tags:-}," in *,latest,*) continue;; esac
                # Fed by a here-string, not a pipe: `grep -q` closing the pipe on
                # its first hit fails the writer under `pipefail`, and a digest
                # that is on the keep list would read as one that is not.
                grep -qx "$digest" <<<"$keep" && continue
              fi
              # An unreadable date is treated as recent: too new to delete is a
              # wasted run, too old is a digest pulled out from under a publish.
              pushed=$([ -n "${created:-}" ] && date -u -d "$created" +%s 2>/dev/null || true)
              if [ -z "$pushed" ] || [ "$pushed" -gt "$cutoff" ]; then
                echo "$digest was pushed minutes ago - left for the next run"
                continue
              fi
              if [ "${DRY_RUN:-false}" = "true" ]; then
                echo "would delete $digest ${tags:+(tagged $tags)}"
                continue
              fi
              if delete_version "/users/$OWNER/packages/container/$package/versions/$id"; then
                echo "deleted $digest ${tags:+(tagged $tags)}"
                removed=$((removed + 1))
                refused=0
              else
                echo "could not delete $digest"
                failed=1
                # One refusal is worth reporting; a run of them means the rest of
                # this package will be refused too, and 800 more calls prove it.
                refused=$((refused + 1))
                [ "$refused" -ge 5 ] && { echo "giving up on $package"; break; }
              fi
            done <<EOF
          $versions
          EOF
            echo "::endgroup::"
          done

          echo "$removed version(s) removed"
          exit "$failed"
