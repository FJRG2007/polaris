name: CI

# Also callable, so dashboard-publish.yml can gate the host-daemon image on it
# rather than publishing whatever the last commit happened to leave behind.

on:
  # Only when something it actually checks changed. This used to run on every
  # push, so a dashboard-only commit paid for a full clippy and cargo test of the
  # whole workspace before failing to say anything about itself. workflow_call is
  # deliberately unfiltered: dashboard-publish.yml gates its image on this, and a
  # gate that skips itself is not a gate.
  push:
    paths:
      - "crates/**"
      - "plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  workflow_call:

# A push that supersedes another stops it: the older answer is about a commit
# nobody is waiting on any more, and it holds a runner the new one needs.
# Releases are never cancelled - see the tag workflows.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Check generated Python is up to date
        run: |
          cargo run -q -p polaris-unas-core --example gen_python > /tmp/_generated.py
          diff -u plugins/unifi-unas/homeassistant/custom_components/unifi_unas/_generated.py /tmp/_generated.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Syntax check only; a full Home Assistant runtime check happens via
      # hassfest in the published integration repo.
      - run: python -m compileall -q plugins/unifi-unas/homeassistant/custom_components
