name: CI

# Also callable, so dashboard-publish.yml can gate the host-daemon image on it
# rather than publishing whatever the last commit happened to leave behind.

on:
  # Only when something it actually checks changed. This used to run on every
  # push, so a dashboard-only commit paid for a full clippy and cargo test of the
  # whole workspace before failing to say anything about itself. workflow_call is
  # deliberately unfiltered: dashboard-publish.yml gates its image on this, and a
  # gate that skips itself is not a gate.
  #
  # Not on main, for the reason dashboard-ci.yml is not either: the publish calls
  # this workflow, both instances land in the concurrency group below, and with
  # cancellation off on main the called one waited out the standalone one and then
  # repeated it - four minutes before the daemon image could start building. The
  # call is the run there. A push to main touching only
  # `rust-toolchain.toml` (which the publish does not watch, since the daemon
  # does not depend on it) gets no run; it was checked on its pull request.
  push:
    branches-ignore: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/scripts/tunnel-inputs.py"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/scripts/tunnel-inputs.py"
      - ".github/workflows/ci.yml"
  workflow_call:

# A superseded run is stopped on a branch, and left to finish on the default one.
# GitHub records a cancelled run as a failure against its commit - a red mark on
# work that was fine - and main's history is the one people read. Elsewhere nobody
# is looking at the superseded commit, so the runner is worth more than the mark.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Incremental compilation is for a machine that keeps its target directory
  # between edits. A runner does not: every artifact it produces is a bigger cache
  # to save and restore, for a rebuild that never happens.
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Instant, and the failure people hit most: run it before anything compiles.
      - run: cargo fmt --all -- --check
      # `--all-targets` compiles the tests too, so `cargo test` below reuses that
      # work rather than starting its own build. Same flags as before: this is
      # about how long the gates take, not about which code they accept.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # A dashboard names the tunnel daemon's image by the crate's version and hosts
  # pull it only when it is missing, so a published version never changes. A pull
  # request that changes what the image is built from has to raise the version;
  # the publish refuses to move the tag either way, this only says so before the
  # merge. Test-only changes need no new version (see the script).
  tunnel-version:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A changed tunnel daemon carries a new version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          manifest=crates/polaris-tunnel/Cargo.toml
          version() { git show "$1:$manifest" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1; }
          if ! git cat-file -e "$BASE:$manifest" 2>/dev/null; then
            echo "the base has no tunnel daemon - nothing published to compare with"
            exit 0
          fi
          before=$(python3 .github/scripts/tunnel-inputs.py "$BASE")
          after=$(python3 .github/scripts/tunnel-inputs.py HEAD)
          if [ "$before" = "$after" ]; then
            echo "the image's sources are unchanged"
          elif [ "$(version "$BASE")" = "$(version HEAD)" ]; then
            echo "::error file=$manifest,title=Tunnel daemon changed without a new version::What version $(version HEAD) is built from changed, but a published version never changes: hosts that pulled it keep it. Raise the version in $manifest."
            exit 1
          else
            echo "sources changed, version $(version "$BASE") -> $(version HEAD)"
          fi
