name: Extension version check

# A pull request that changes what the extension ships has to bump its version,
# because the version reaching main is what releases it (see
# `extension-auto-release.yml`). Without the bump the change lands and never
# reaches a browser. Tests and docs ship nothing, so they need no bump. The
# workspace packages the extension bundles (`@polaris/core`,
# `@polaris/vault-crypto`) ship with it, so their source counts too.
#
# No path filter: it runs on every pull request and passes at once when nothing
# shipped changed, so `bumped` can be a required check without leaving
# unrelated pull requests waiting on a check that never starts.
#
# A green check on a pull request is measured against main as it was when the
# check ran, and nothing re-runs it when another pull request merges. In a merge
# queue it runs again against the queued main; on every push to main it runs
# once more over what that push changed, so a change that landed under a version
# main already had turns main red instead of never reaching a browser.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bumped:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The version moves when shipped files change
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          version() { git show "$1:dashboard/apps/extension/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"; }
          # Whether $1 sorts after $2 as a version (0.1.10 after 0.1.9).
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }
          # Measured from where the branch left main, not from main's tip: a
          # branch a few merges behind would otherwise "change" every file main
          # gained since, and fail on work that is not its own.
          FORK="$(git merge-base "$BASE" "$HEAD")"
          shipped="$(git diff --name-only "$FORK" "$HEAD" -- \
              dashboard/apps/extension \
              dashboard/packages/core/src \
              dashboard/packages/core/package.json \
              dashboard/packages/vault-crypto/src \
              dashboard/packages/vault-crypto/package.json \
            | grep -v -E '^dashboard/apps/extension/(test/|vitest\.config\.ts$)|\.md$' || true)"
          if [ -z "$shipped" ]; then
            echo "Nothing the extension ships changed; no bump needed."
            exit 0
          fi
          before="$(version "$FORK")"
          main="$(version "$BASE")"
          after="$(version "$HEAD")"
          if [ "$before" = "$after" ]; then
            echo "These files change what the extension ships, but its version is still $before:" >&2
            echo "$shipped" >&2
            echo "Bump \"version\" in dashboard/apps/extension/package.json (and the lockfile entry)." >&2
            exit 1
          fi
          # Two pull requests bumping from the same version each pass on their
          # own, and the second to merge ships under a number already released.
          # Past main's version and past the latest release when the check runs.
          # A push to main may already be tagged by the time this runs, so
          # there the version only has to be past what main had before it.
          released=""
          if [ "$EVENT" != "push" ]; then
            released="$(git tag -l 'extension-v*' | sed 's/^extension-v//' | sort -V | tail -n1)"
          fi
          for floor in "$main" ${released:+"$released"}; do
            if ! newer "$after" "$floor"; then
              echo "Version $after is not past $floor (main is at $main, latest release ${released:-none})." >&2
              echo "Bump \"version\" in dashboard/apps/extension/package.json past both (and the lockfile entry)." >&2
              exit 1
            fi
          done
          echo "Version $before -> $after (main $main, latest release ${released:-none})."
