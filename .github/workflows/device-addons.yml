# Device add-ons (docs/device-addons.md): build every add-on under
# clients/device-addons/, write the catalog, sign it, and publish all of it on the
# `device-addons` release, which the desktop app reads from any host.
name: Device add-ons

on:
  push:
    branches: [main]
    paths:
      - "clients/device-addons/**"
      - ".github/workflows/device-addons.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-addons
  cancel-in-progress: false

jobs:
  # The native modules add-ons load, one per platform they ship on. Not
  # committed: built here from the crate, so the package holds exactly what
  # the repository's source compiles to.
  native:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: win32-x64
            os: windows-latest
            file: polaris_stream100_node.dll
          - platform: linux-x64
            os: ubuntu-latest
            file: libpolaris_stream100_node.so
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: device-addons-${{ matrix.platform }}
      - run: cargo build -p polaris-stream100-node --profile release-node --locked
      - name: Stage the module
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native/hercules-stream100/${{ matrix.platform }}"
          cp "target/release-node/${{ matrix.file }}" "$RUNNER_TEMP/native/hercules-stream100/${{ matrix.platform }}/stream100.node"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/native
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Each platform's module into its add-on's `<platform>/` folder.
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: clients/device-addons
          merge-multiple: true
      - name: Install fflate
        working-directory: clients/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and sign the catalog
        env:
          DEVICE_ADDONS_SIGNING_KEY: ${{ secrets.DEVICE_ADDONS_SIGNING_KEY }}
        run: node clients/device-addons/scripts/publish.mjs clients/device-addons "$RUNNER_TEMP/device-addons"
      - name: Publish on the device-addons release
        env:
          GH_TOKEN: ${{ github.token }}
          # The uploads run from the output folder, outside the checkout, where
          # gh cannot read the repository from git.
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view device-addons >/dev/null 2>&1; then
            gh release create device-addons --title "Device add-ons" --notes "The catalog and packages of device add-ons. Updated by CI." --latest=false
          fi
          cd "$RUNNER_TEMP/device-addons"
          # Packages first, the catalog that names them last, its signature after it.
          ls | grep -v '^catalog\.json' | xargs -r gh release upload device-addons --clobber
          gh release upload device-addons --clobber catalog.json
          gh release upload device-addons --clobber catalog.json.sig
