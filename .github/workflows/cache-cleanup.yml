name: Cache cleanup

# Deletes a pull request's caches once it is closed or merged.
#
# Every run of Dashboard CI on a pull request saves a Next build cache of about
# 350 MB under that pull request's ref, and nothing else can ever read it. The
# repository holds 10 GB of caches in all, and past that GitHub evicts the least
# recently used - which, with a dozen pull requests in a day, was main's copies and
# the npm cache every job installs from.
#
# pull_request_target so a pull request from a fork can be cleaned up too: its own
# token cannot delete caches. Nothing from the pull request is checked out or run
# here, which is what keeps that trigger safe.

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the pull request's caches
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$REF" --limit 100 --json id --jq '.[].id' |
            while read -r id; do
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::Could not delete cache $id."
            done
