name: Dashboard CI

# Typecheck, lint, test and build the dashboard monorepo on any change under
# dashboard/. Runs independently of the Rust/Python CI in ci.yml.
#
# Also callable, so dashboard-publish.yml can gate an image on it: an image built
# from a commit that failed here is one every deployment is then offered as an
# update, which is how a red build reaches production.
#
# Two jobs rather than one, and the split is deliberate. Everything used to run in
# a line: build every package, build the app, then typecheck, lint and test - so
# the gates waited on a Next build they have nothing to do with. They need the
# packages' declarations and nothing more. Now the app build and the gates run
# beside each other, and the run costs the longer of the two instead of the sum.
# Both still run: nothing is skipped to make this faster.
#
# Not on main, and that is the point. The publish workflow calls this one, and both
# instances share the concurrency group below; with cancellation off on main the
# called one simply waited for the standalone one to finish and then ran the
# identical suite again, which cost the publish four minutes before it started. On
# main the call is the run. What that gives up is a push to main touching only paths
# the publish does not watch (docs/, scripts/, ROADMAP.md): those get no run there.
# Everything reaches main through a pull request, so that code was already checked on
# its branch.

on:
  push:
    branches-ignore: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_call:
    inputs:
      skip_app:
        description: "Skip the app build - the caller is building the same app inside its image."
        type: boolean
        default: false

# A superseded run is stopped on a branch, and left to finish on the default one.
# GitHub records a cancelled run as a failure against its commit, and main's
# history is the one people read; a red mark there on work that was fine costs
# more than the runner it saves.
concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: dashboard

env:
  # Nothing here is interactive, and neither of these tells anyone anything.
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  # `whatsapp-web.js` brings in puppeteer, whose install step downloads a copy of
  # Chrome from Google's CDN - which answered 403 for the pinned build and took
  # `npm ci` down with it, on a commit that touched neither. Nothing in this
  # workflow drives a browser: it typechecks, lints, and runs tests that render
  # to markup. So the download is skipped, and CI stops depending on a third
  # party being in a good mood.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  # The same story, one dependency along. `onnxruntime-node` ships the CPU
  # runtime for every platform inside the package, and then - on linux/x64 only -
  # downloads the CUDA execution provider from nuget.org in a postinstall. A
  # connect timeout to nuget took `npm ci` down with it, on a commit that touched
  # nothing near it.
  #
  # Nothing here, or anywhere in Polaris, would ever load that binary: the vision
  # worker runs on the processor, which is what its own screen promises. So the
  # download buys nothing and is skipped. The images were never affected - their
  # `npm ci` already runs with --ignore-scripts.
  ONNXRUNTIME_NODE_INSTALL: "skip"

jobs:
  checks:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci --prefer-offline
      - run: npm run db:generate
      # The packages only. They publish the declarations everything below reads;
      # the app's own build is another job's problem and nothing here waits on it.
      - run: npm run build:packages
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run test

  # Proof that the app compiles, for branches and pull requests. The publish workflow
  # builds the very same app inside the image it ships, so it asks for this to be
  # skipped rather than paying for a second Next build of the same commit.
  #
  # The condition is a negation of an input that defaults to false on purpose. An
  # `inputs.build_app != false` reads as the obvious form and is wrong: on a push
  # there is no input, and GitHub casts both null and false to 0, so the job would
  # be skipped exactly where it is the only gate there is.
  app:
    name: build
    if: ${{ !inputs.skip_app }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # Most of a Next build is recompiling what did not change. Keyed on the
      # lockfile so a dependency change starts clean, and restored across commits
      # otherwise.
      - uses: actions/cache@v4
        with:
          path: dashboard/apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}-
            next-${{ runner.os }}-

      - run: npm ci --prefer-offline
      - run: npm run db:generate
      - run: npm run build:packages
      - run: npm run build -w @polaris/web
