name: Dashboard CI

# Typecheck, lint, test and build the dashboard monorepo on any change under
# dashboard/. Runs independently of the Rust/Python CI in ci.yml.
#
# Also callable, so dashboard-publish.yml can gate an image on it: an image built
# from a commit that failed here is one every deployment is then offered as an
# update, which is how a red build reaches production.
#
# Two jobs rather than one, and the split is deliberate. Everything used to run in
# a line: build every package, build the app, then typecheck, lint and test - so
# the gates waited on a Next build they have nothing to do with. They need the
# packages' declarations and nothing more. Now the app build and the gates run
# beside each other, and the run costs the longer of the two instead of the sum.
# Both still run: nothing is skipped to make this faster.
#
# The web app's suite runs in its own jobs, split four ways. It is nine tenths of
# the test time - about fifteen minutes of 1,500-odd files on one runner, after
# the typecheck - and it was what every publish waited on, well after the image
# itself was built. Each shard runs a fixed quarter of the files, so every test
# still runs on every commit; they simply run on four machines at once.
#
# Not on main, and that is the point. The publish workflow calls this one, and both
# instances share the concurrency group below; with cancellation off on main the
# called one simply waited for the standalone one to finish and then ran the
# identical suite again, which cost the publish four minutes before it started. On
# main the call is the run. What that gives up is a push to main touching only paths
# the publish does not watch (docs/, scripts/, ROADMAP.md): those get no run there.
# Everything reaches main through a pull request, so that code was already checked on
# its branch.
#
# On a branch it runs for the pull request only. It used to run for the push as well,
# and since the two have different refs the concurrency group never joined them: every
# commit on an open pull request ran the whole suite twice, six jobs each, on the
# same code. A branch with no pull request yet can still be checked by hand
# (workflow_dispatch).
#
# Caches. A branch can read its own caches and main's, never another branch's. So
# the warm copies every branch starts from are saved on main, by dashboard-cache.yml,
# and a closed pull request's own are deleted (cache-cleanup.yml) so they do not push
# main's out of the repository's quota.

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_app:
        description: "Skip the app build - the caller is building the same app inside its image."
        type: boolean
        default: false

# A superseded run is stopped on a branch, and left to finish on the default one.
# GitHub records a cancelled run as a failure against its commit, and main's
# history is the one people read; a red mark there on work that was fine costs
# more than the runner it saves.
concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: dashboard

env:
  # Nothing here is interactive, and neither of these tells anyone anything.
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  # `whatsapp-web.js` brings in puppeteer, whose install step downloads a copy of
  # Chrome from Google's CDN - which answered 403 for the pinned build and took
  # `npm ci` down with it, on a commit that touched neither. Nothing in this
  # workflow drives a browser: it typechecks, lints, and runs tests that render
  # to markup. So the download is skipped, and CI stops depending on a third
  # party being in a good mood.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  # The same story, one dependency along. `onnxruntime-node` ships the CPU
  # runtime for every platform inside the package, and then - on linux/x64 only -
  # downloads the CUDA execution provider from nuget.org in a postinstall. A
  # connect timeout to nuget took `npm ci` down with it, on a commit that touched
  # nothing near it.
  #
  # Nothing here, or anywhere in Polaris, would ever load that binary: the vision
  # worker runs on the processor, which is what its own screen promises. So the
  # download buys nothing and is skipped. The images were never affected - their
  # `npm ci` already runs with --ignore-scripts.
  ONNXRUNTIME_NODE_INSTALL: "skip"

jobs:
  checks:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci --prefer-offline

      # A high or critical advisory in a production dependency fails the pull
      # request that changes the dependencies, unless scripts/audit-allowlist.json
      # accepts it with a reason and an expiry (docs/dependencies.md). Anywhere
      # else - a push, the publish workflow's call, a pull request that touches no
      # manifest - it is reported and does not fail: an advisory published today
      # against a package nobody changed is not that change's fault, and the
      # weekly maintenance run opens the issue for it. In that same non-gating
      # case, npm or audit-gate.mjs itself failing to produce a report (exit 2)
      # is a warning, not a failure: a broken check should not block a change it
      # was not meant to gate.
      - name: Audit production dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mode=--warn-only
          if [ -n "$BASE_SHA" ]; then
            # Not knowing what changed is treated as a dependency change.
            if ! git fetch --no-tags --depth=1 origin "$BASE_SHA" \
              || git diff --name-only "$BASE_SHA" HEAD -- . | grep -qE '(^|/)package(-lock)?\.json$|^dashboard/scripts/audit-allowlist\.json$'; then
              mode=
            fi
          fi
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/audit-gate.mjs "$RUNNER_TEMP/audit.json" $mode --title "Production dependencies" | tee -a "$GITHUB_STEP_SUMMARY"
          status="${PIPESTATUS[0]}"
          if [ -n "$mode" ] && [ "$status" = 2 ]; then
            echo "::warning title=npm audit::The audit could not run (npm or its report failed); not gating this change on it."
            echo "Audit could not run: npm or its report failed." >> "$GITHUB_STEP_SUMMARY"
            status=0
          fi
          exit "$status"

      - run: npm run db:generate
      # The packages only. They publish the declarations everything below reads;
      # the app's own build is another job's problem and nothing here waits on it.
      #
      # Built once per set of package sources, not once per job. The key hashes
      # everything a package build reads - its sources, the lockfile and patches,
      # the shared tsconfig and the two build scripts - and leaves out what the
      # build writes, so a changed package always misses and rebuilds. Most changes
      # touch only the app, and then all six jobs skip the two minutes.
      - id: packages
        uses: actions/cache@v6
        with:
          path: dashboard/packages/*/dist
          key: packages-v1-${{ runner.os }}-node22-${{ hashFiles('dashboard/packages/**', 'dashboard/package-lock.json', 'dashboard/patches/**', 'dashboard/tsconfig.base.json', 'dashboard/scripts/build-packages.mjs', 'dashboard/scripts/scope-editor-styles.mjs', '!dashboard/packages/*/dist/**', '!dashboard/packages/**/node_modules/**', '!dashboard/packages/db/generated/**') }}
      - if: steps.packages.outputs.cache-hit != 'true'
        run: npm run build:packages
      - run: npm run typecheck
      - run: npm run lint --if-present
      # Every workspace's tests but the web app's, which the shards below run.
      - name: Test the packages and the other apps
        run: |
          workspaces=$(npm query .workspace | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk)).on("end", () => {
              const all = JSON.parse(raw).filter((w) => w.scripts?.test && w.name !== "@polaris/web");
              console.log(all.map((w) => `-w ${w.name}`).join(" "));
            });')
          [ -n "$workspaces" ] || { echo "::error::No workspace with tests was found."; exit 1; }
          npm run test $workspaces
          npm run test:scripts

  web-tests:
    name: web tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # One failing quarter should not hide what the other three would report.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci --prefer-offline
      - run: npm run db:generate
      # The same cache as the checks job above, and the same key, written out
      # again because a key cannot be shared between jobs. dashboard-cache.yml
      # carries it a fourth time; the four must stay identical.
      - id: packages
        uses: actions/cache@v6
        with:
          path: dashboard/packages/*/dist
          key: packages-v1-${{ runner.os }}-node22-${{ hashFiles('dashboard/packages/**', 'dashboard/package-lock.json', 'dashboard/patches/**', 'dashboard/tsconfig.base.json', 'dashboard/scripts/build-packages.mjs', 'dashboard/scripts/scope-editor-styles.mjs', '!dashboard/packages/*/dist/**', '!dashboard/packages/**/node_modules/**', '!dashboard/packages/db/generated/**') }}
      - if: steps.packages.outputs.cache-hit != 'true'
        run: npm run build:packages
      - run: npm run test -w @polaris/web -- --shard=${{ matrix.shard }}/4

  # Proof that the app compiles, for branches and pull requests. The publish workflow
  # builds the very same app inside the image it ships, so it asks for this to be
  # skipped rather than paying for a second Next build of the same commit.
  #
  # The condition is a negation of an input that defaults to false on purpose. An
  # `inputs.build_app != false` reads as the obvious form and is wrong: on a pull
  # request there is no input, and GitHub casts both null and false to 0, so the
  # job would be skipped exactly where it is the only gate there is.
  app:
    name: build
    if: ${{ !inputs.skip_app }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # Most of a Next build is recompiling what did not change. Keyed on the
      # lockfile so a dependency change starts clean, and restored across commits
      # otherwise. A pull request's first run restores main's copy, which
      # dashboard-cache.yml keeps warm; before that existed every branch started
      # cold, because nothing on main ever saved one.
      - uses: actions/cache@v6
        with:
          path: dashboard/apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}-
            next-${{ runner.os }}-

      - run: npm ci --prefer-offline
      - run: npm run db:generate
      # The same cache as the checks job above, and the same key, written out
      # again because a key cannot be shared between jobs. dashboard-cache.yml
      # carries it a fourth time; the four must stay identical.
      - id: packages
        uses: actions/cache@v6
        with:
          path: dashboard/packages/*/dist
          key: packages-v1-${{ runner.os }}-node22-${{ hashFiles('dashboard/packages/**', 'dashboard/package-lock.json', 'dashboard/patches/**', 'dashboard/tsconfig.base.json', 'dashboard/scripts/build-packages.mjs', 'dashboard/scripts/scope-editor-styles.mjs', '!dashboard/packages/*/dist/**', '!dashboard/packages/**/node_modules/**', '!dashboard/packages/db/generated/**') }}
      - if: steps.packages.outputs.cache-hit != 'true'
        run: npm run build:packages
      # Node's default heap tops out near 4 GB, and the app build now peaks right
      # at it: the same commit passed on one run and died with "JavaScript heap
      # out of memory" on the next. The runner has 16 GB, so the build gets room
      # instead of a coin toss.
      #
      # The checks job runs ESLint over the same sources in this same run, so the
      # build skips its own copy (next.config.mjs). It keeps its type check, which
      # alone sees the route types Next generates during the build.
      - run: npm run build -w @polaris/web
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          POLARIS_BUILD_SKIP_LINT: "1"
