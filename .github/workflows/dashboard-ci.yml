name: Dashboard CI

# Typecheck, lint, test and build the dashboard monorepo on any change under
# dashboard/. Runs independently of the Rust/Python CI in ci.yml.
#
# Also callable, so dashboard-publish.yml can gate an image on it: an image built
# from a commit that failed here is one every deployment is then offered as an
# update, which is how a red build reaches production.

on:
  push:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_call:

# A push that supersedes another stops it, so a run of pushes costs one build
# rather than one per commit.
concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # The Next build is most of this job's wall clock, and almost all of it is
      # recompiling code that did not change. Keyed on the lockfile so a dependency
      # change starts clean, and restored across commits otherwise.
      - uses: actions/cache@v4
        with:
          path: dashboard/apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}-
            next-${{ runner.os }}-

      - run: npm ci
      - run: npm run db:generate
      # Packages consume each other's built declarations, so build before the
      # type/test gates; the build itself is dependency-ordered.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run test
