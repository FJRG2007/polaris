name: Desktop

# The Polaris desktop app (desktop/): typecheck and test it on any change there,
# and on a `desktop-v*` tag - or by hand - build the installers on Windows, macOS
# and Linux and attach them to the tag's GitHub release.
#
# Its own npm project with its own lockfile: nothing here installs the
# dashboard's dependencies, and nothing in the dashboard's CI installs these.
#
# Unsigned unless the signing secrets exist (see desktop/README.md for their
# names). Secrets are handed only to the step that signs, never to `npm ci`,
# which runs third-party install scripts, and only on a `desktop-v*` tag or on
# main: a run by hand from any other branch builds unsigned.
#
# SignPath is optional for good, and nothing a release needs may depend on it.
# Its signed Windows build is a job of its own, after the ordinary builds: that job
# failing for any reason - no approval in time, a revoked token or certificate,
# even its action no longer existing, which would fail the whole job it is used
# in before a single step ran - leaves the ordinary build to be published
# instead. Squirrel takes an update from either, so an installed app never sees
# the difference.
#
# The release also carries the macOS update feeds and a SHA256SUMS of every
# file, which the app's self-update reads (desktop/src/main/updates.ts).
#
# Node 22 on purpose: the packager's zip extractor stops silently, reporting
# success, on newer Node, and the installers come out empty.

on:
  push:
    tags:
      - "desktop-v*"
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # What ships is only the bundled app and its runtime dependencies; the build
      # tooling's advisories are reviewed in desktop/README.md.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: The tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="desktop-v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $expected." >&2
            exit 1
          fi

      - run: npm ci

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg squashfs-tools

      # The AppImage runtime from a fixed release, checked against its published
      # digest, instead of the maker's default of the moving "continuous" build.
      - name: AppImage runtime
        if: runner.os == 'Linux'
        run: |
          runtime="$RUNNER_TEMP/runtime-x86_64"
          curl -fsSL -o "$runtime" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $runtime" | sha256sum -c -
          echo "APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"

      # The VPN service. Its driver on Windows comes from a fixed release, checked
      # against its digest, and is shipped untouched beside its licence.
      - name: VPN service
        env:
          # Static on Linux, so it runs on systems older than the build machine.
          TARGET: ${{ matrix.os == 'macos-latest' && (matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || matrix.os == 'ubuntu-latest' && 'x86_64-unknown-linux-musl' || '' }}
        run: |
          [ "$RUNNER_OS" != Linux ] || sudo apt-get install -y musl-tools
          rustup toolchain install 1.97.1 --profile minimal
          [ -z "$TARGET" ] || rustup target add "$TARGET" --toolchain 1.97.1
          (cd vpn-helper && cargo +1.97.1 test --locked)
          (cd vpn-helper && cargo +1.97.1 build --release --locked ${TARGET:+--target "$TARGET"})
          if [ "$RUNNER_OS" = Windows ]; then
            driver="$RUNNER_TEMP/wireguard-nt.zip"
            curl -fsSL -o "$driver" https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip
            echo "dceb30a9bc4be48cce0f74160fc88a585a2c2627366e8f846fc6658f9038dace  $driver" | sha256sum -c -
            unzip -q "$driver" -d "$RUNNER_TEMP/wireguard-nt"
            node vpn-helper/stage.mjs "$TARGET" "$RUNNER_TEMP/wireguard-nt/wireguard-nt"
          else
            node vpn-helper/stage.mjs "$TARGET"
          fi

      - name: Which signing secrets exist
        id: signing
        if: startsWith(github.ref, 'refs/tags/desktop-v') || github.ref == 'refs/heads/main'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          echo "windows=$([ -n "$WINDOWS_CERTIFICATE_BASE64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "apple=$([ -n "$APPLE_CERTIFICATE_BASE64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Windows code-signing certificate
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'true'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          certificate="$RUNNER_TEMP/windows-signing.pfx"
          printf '%s' "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          echo "WINDOWS_CERTIFICATE_FILE=$certificate" >> "$GITHUB_ENV"

      - name: Apple signing identity
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/apple-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"

      - name: Build the installers
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ steps.signing.outputs.windows == 'true' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.apple == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ steps.signing.outputs.apple == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.signing.outputs.apple == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.apple == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          npm run build
          npx electron-forge make --arch=${{ matrix.arch }}

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/windows-signing.pfx"
          if [ "$RUNNER_OS" = "macOS" ] && [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: polaris-desktop-${{ runner.os }}-${{ matrix.arch }}
          path: desktop/out/make/**
          if-no-files-found: error

  # Whether SignPath is set up at all. Secrets cannot be read in a job's `if`.
  signpath-configured:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          configured=false
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ] && [ -n "$SIGNPATH_PROJECT_SLUG" ] && [ -n "$SIGNPATH_SIGNING_POLICY_SLUG" ]; then
            configured=true
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

  # The Windows build again, through SignPath. Never required: see the top of this
  # file. Its artifact is uploaded last, so it exists only if every step passed.
  windows-signpath:
    needs: [build, signpath-configured]
    if: needs.signpath-configured.outputs.configured == 'true'
    continue-on-error: true
    runs-on: windows-latest
    # Above the sum of its steps' timeouts: a step that times out fails, which the
    # release falls back from, and GitHub does not document what this one reports.
    timeout-minutes: 190
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        timeout-minutes: 10

      # Windows through SignPath, in two rounds, because Squirrel packs the app
      # into the installer: the packaged app is signed first and the installer
      # is made from it, so the package inside carries the signed polaris.exe;
      # then the installer itself is signed. Squirrel's own helpers (Update.exe
      # and the shortcut stub) are upstream binaries and stay unsigned, as
      # SignPath Foundation signs only what is built from this repository.
      - name: Package the app to sign
        timeout-minutes: 20
        run: |
          npm run build
          npx electron-forge package --arch=x64

      - name: Upload the app to sign
        id: unsigned-app
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-Windows-x64
          path: desktop/out/Polaris-win32-x64/
          if-no-files-found: error
          retention-days: 1

      - name: Sign the app
        timeout-minutes: 50
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          # A release signing request waits for a person to approve it.
          wait-for-completion-timeout-in-seconds: 2700
          output-artifact-directory: ${{ github.workspace }}/desktop/out/signed-app

      - name: Make the installer from the signed app
        timeout-minutes: 20
        run: |
          powershell -NoProfile -Command "if ((Get-AuthenticodeSignature 'out/signed-app/polaris.exe').Status -ne 'Valid') { Write-Error 'polaris.exe came back without a valid signature.'; exit 1 }"
          rm -rf "out/Polaris-win32-x64"
          mv out/signed-app "out/Polaris-win32-x64"
          npx electron-forge make --skip-package --arch=x64

      - name: Upload the installer to sign
        id: unsigned-installer
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-Windows-x64
          path: desktop/out/make/squirrel.windows/x64/Polaris-Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer
        timeout-minutes: 50
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 2700
          output-artifact-directory: ${{ github.workspace }}/desktop/out/signed-installer

      - name: Put the signed installer in place
        timeout-minutes: 5
        run: |
          powershell -NoProfile -Command "if ((Get-AuthenticodeSignature 'out/signed-installer/Polaris-Setup.exe').Status -ne 'Valid') { Write-Error 'Polaris-Setup.exe came back without a valid signature.'; exit 1 }"
          mv -f out/signed-installer/Polaris-Setup.exe "out/make/squirrel.windows/x64/Polaris-Setup.exe"

      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: polaris-signed-Windows-x64
          path: desktop/out/make/**
          if-no-files-found: error

  release:
    # `!cancelled()` so a failed signed build, which is allowed, does not skip this,
    # while cancelling the run still stops the release.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/desktop-v') && needs.build.result == 'success' }}
    needs: [build, windows-signpath]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: desktop/build
      - uses: actions/download-artifact@v4
        with:
          pattern: polaris-desktop-*
          path: installers
      - name: Fetch the signed Windows build, if there is one
        id: signed
        if: needs.windows-signpath.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: polaris-signed-Windows-x64
          path: installers-signed
      - name: Prefer the signed Windows build
        run: |
          if [ -f installers-signed/squirrel.windows/x64/Polaris-Setup.exe ] && [ -f installers-signed/squirrel.windows/x64/RELEASES ]; then
            rm -rf installers/polaris-desktop-Windows-x64
            mv installers-signed installers/polaris-desktop-Windows-x64
          elif [ "${{ needs.windows-signpath.result }}" != "skipped" ]; then
            echo "::warning::SignPath did not produce a signed build; this release carries the ordinary Windows build."
          fi
      # The macOS update feeds name this release's zips (src/main/updates.ts);
      # the checksums are what an AppImage checks its replacement against.
      - name: Update feeds and checksums
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${TAG#desktop-v}"
          for arch in arm64 x64; do
            zip="$(find installers -path "*/zip/darwin/$arch/*.zip" -print -quit)"
            if [ -z "$zip" ]; then
              echo "No macOS $arch zip to point the update feed at." >&2
              exit 1
            fi
            node desktop/build/mac-feed.cjs "$arch" "$version" "https://github.com/$REPOSITORY/releases/download/$TAG/$(basename "$zip")" installers
          done
          find installers -type f \( -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name 'RELEASES-darwin-*.json' -o -name '*.dmg' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec sha256sum {} + | sed -E 's#^([0-9a-f]{64}) [ *].*/#\1  #' | sort -k 2 > SHA256SUMS
          if [ -n "$(cut -c 67- SHA256SUMS | uniq -d)" ]; then
            echo "Two release files share a name." >&2
            exit 1
          fi
          mv SHA256SUMS installers/SHA256SUMS
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Polaris desktop ${{ github.ref_name }}
          # The repository releases the dashboard too; the desktop app is not
          # made its "latest release".
          make_latest: "false"
          body: "[Code signing policy](https://github.com/${{ github.repository }}/blob/main/desktop/CODE_SIGNING.md)"
          files: |
            installers/**/*.exe
            installers/**/*.nupkg
            installers/**/RELEASES
            installers/**/*.dmg
            installers/**/*.zip
            installers/**/*.deb
            installers/**/*.AppImage
            installers/RELEASES-darwin-*.json
            installers/SHA256SUMS
