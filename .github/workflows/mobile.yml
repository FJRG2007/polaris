name: Mobile

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests, lint and release build
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/polaris-android.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polaris-android
          path: ${{ runner.temp }}/polaris-android.apk
          if-no-files-found: error

  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned by checksum: the project file is generated from project.yml, not kept by hand.
      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build for the simulator
        working-directory: mobile/ios
        run: |
          xcodegen generate
          xcodebuild -project Polaris.xcodeproj -target Polaris -sdk iphonesimulator \
            -configuration Release CODE_SIGNING_ALLOWED=NO build

  android-release:
    name: Publish the signed Android APK
    # Main only, and nothing until the signing key exists: a key made per run would stop every later
    # version installing over the one before it.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MOBILE_KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
      MOBILE_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
      MOBILE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
      # Google Play: a service account with release access to the app in Play Console. Without it the release
      # still goes to GitHub, and the bundle attached there is what gets uploaded by hand.
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Decide
        id: decide
        run: |
          version=$(sed -n "s/^ *versionName '\(.*\)'/\1/p" mobile/android/app/build.gradle)
          echo "tag=android-v$version" >> "$GITHUB_OUTPUT"
          if [ -z "$MOBILE_KEYSTORE_BASE64" ]; then
            echo "::notice::No mobile signing key yet, so nothing is published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "android-v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.decide.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        if: steps.decide.outputs.publish == 'true'
        with:
          packages: platforms;android-36 build-tools;35.0.0
      - name: Build and publish
        if: steps.decide.outputs.publish == 'true'
        run: |
          export MOBILE_KEYSTORE_PATH="$RUNNER_TEMP/mobile.keystore"
          printf '%s' "$MOBILE_KEYSTORE_BASE64" | base64 -d > "$MOBILE_KEYSTORE_PATH"
          (cd mobile/android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease bundleRelease)
          rm -f "$MOBILE_KEYSTORE_PATH"
          mkdir out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk out/polaris-android.apk
          # The bundle Google Play takes, signed with the same key as the APK (Play's upload key).
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab out/polaris-android.aab
          (cd out && sha256sum polaris-android.apk polaris-android.aab > SHA256SUMS)
          gh release create "${{ steps.decide.outputs.tag }}" out/* \
            --title "Polaris for Android ${{ steps.decide.outputs.tag }}" \
            --notes "Install polaris-android.apk on the phone. Later versions install over it, and the app offers them itself. polaris-android.aab is the bundle for Google Play." \
            --latest=false
      # Play reads "what's new" as one whatsnew-<locale> file per language: the same text F-Droid reads from
      # fastlane/metadata/android/<locale>/changelogs/<versionCode>.txt.
      - name: Google Play release notes
        if: steps.decide.outputs.publish == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          code=$(sed -n "s/^ *versionCode \([0-9]*\)/\1/p" mobile/android/app/build.gradle)
          mkdir -p "$RUNNER_TEMP/whatsnew"
          for dir in mobile/android/fastlane/metadata/android/*/; do
            locale=$(basename "$dir")
            if [ -f "$dir/changelogs/$code.txt" ]; then
              cp "$dir/changelogs/$code.txt" "$RUNNER_TEMP/whatsnew/whatsnew-$locale"
            fi
          done
      # Track and status come from repository variables. A Play app that has never been published accepts only
      # draft releases, so the default is a draft on the internal track; set PLAY_STATUS to "completed" and
      # PLAY_TRACK to "production" once the listing is live.
      - name: Upload to Google Play
        if: steps.decide.outputs.publish == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.polaris.mobile
          releaseFiles: out/polaris-android.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'draft' }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          mappingFile: mobile/android/app/build/outputs/mapping/release/mapping.txt
