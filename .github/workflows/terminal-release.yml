name: terminal release

# Polaris Terminal installers, attached to the GitHub release of a
# `terminal-v*` tag (Rook's release.yml, run from clients/terminal/). Push a tag, run
# this by hand, or let terminal-auto-release.yml cut one.
#
# The tag is `terminal-v0.YYYY.MM.DD.HH.MM.oss_NN`. The bundle scripts embed the
# version that follows the `terminal-` prefix, which is the shape
# `ParsedVersion` reads.
on:
  push:
    tags: ["terminal-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (e.g. terminal-v0.2026.11.24.10.00.oss_00)
        required: true

concurrency:
  group: terminal-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      # One platform failing should not deny the others their artifact.
      fail-fast: false
      matrix:
        include:
          - os: windows
            name: Windows installer (x64)
            runner: windows-latest
            artifact: polaris-terminal-windows-x64
          - os: macos
            name: macOS disk image
            runner: macos-latest
            artifact: polaris-terminal-macos
          - os: linux
            name: Linux AppImage
            runner: ubuntu-latest
            artifact: polaris-terminal-linux-x86_64
    defaults:
      run:
        shell: bash
        working-directory: clients/terminal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            terminal-v*) ;;
            *) echo "::error::$TAG is not a terminal-v* tag"; exit 1 ;;
          esac
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#terminal-}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/terminal-prepare-environment
        with:
          target_os: ${{ matrix.os }}
          install_release_deps: 'true'
          # Kept to this workflow: CI's release-profile job only runs
          # `cargo check`, so what it caches has no codegen behind it.
          cache_key: ${{ matrix.os }}-rlto

      - name: Install Inno Setup
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # ISCC is not on PATH after install, and it lands in one of two places
          # depending on whether the package installs per-machine or per-user.
          $iscc = Get-ChildItem -Path @(
              "${env:ProgramFiles(x86)}",
              "$env:ProgramFiles",
              "$env:LOCALAPPDATA\Programs"
            ) -Filter ISCC.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }
          $iscc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install create-dmg (macOS)
        if: matrix.os == 'macos'
        run: brew install create-dmg

      - name: Install linuxdeploy (Linux)
        if: matrix.os == 'linux'
        run: |
          ./script/linux/install_linuxdeploy
          if [[ ":$PATH:" != *":$HOME/.local/bin:"* ]]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      # Every packaging tool is asked for up front, so a missing one fails in
      # seconds instead of after thirty minutes of compiling.
      - name: Check the packaging tools are present
        run: |
          set -euo pipefail
          # A counter and not an array: macOS's bash 3.2 treats an empty array
          # under `set -u` as unbound.
          missing=0
          require() {
            if ! command -v "$1" >/dev/null 2>&1; then
              echo "::error::missing packaging tool: $1 - $2"
              missing=1
            fi
          }
          # A cargo subcommand is found in $CARGO_HOME/bin as well as on PATH.
          require_cargo() {
            home="${CARGO_HOME:-$HOME/.cargo}"
            home="${home//\\//}"
            if command -v "cargo-$1" >/dev/null 2>&1 \
              || [ -x "$home/bin/cargo-$1" ] \
              || [ -x "$home/bin/cargo-$1.exe" ]; then
              return
            fi
            echo "::error::missing packaging tool: cargo $1 - $2"
            missing=1
          }
          case "${{ matrix.os }}" in
            windows)
              require ISCC 'Inno Setup, builds the .exe installer'
              require_cargo about 'generates THIRD_PARTY_LICENSES.txt'
              ;;
            macos)
              require create-dmg 'lays out the .dmg'
              require_cargo bundle 'packages the .app that becomes the .dmg'
              require_cargo about 'generates THIRD_PARTY_LICENSES.txt'
              ;;
            linux)
              require linuxdeploy 'builds the AppImage'
              require_cargo about 'generates THIRD_PARTY_LICENSES.txt'
              ;;
          esac
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # Nothing here is code-signed: no Apple or Windows certificate is held for
      # the terminal yet, so both platforms warn on first run.
      - name: Build installer (Windows)
        id: bundle_windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          .\script\windows\bundle.ps1 `
            -CHANNEL oss `
            -ARCH x64 `
            -RELEASE_TAG ${{ steps.tag.outputs.version }}

      - name: Build disk image (macOS)
        if: matrix.os == 'macos'
        env:
          GIT_RELEASE_TAG: ${{ steps.tag.outputs.version }}
        run: ./script/macos/bundle --channel oss --nosign

      - name: Build AppImage (Linux)
        if: matrix.os == 'linux'
        env:
          GIT_RELEASE_TAG: ${{ steps.tag.outputs.version }}
        run: ./script/linux/bundle --channel oss --packages appimage

      - name: Locate artifacts
        id: artifacts
        run: |
          # Spelled out rather than `**`, which needs bash 4's globstar. Two
          # depths because the bundle scripts insert the target triple when
          # cross-compiling. The path is relative to the repository root, which
          # is what the upload steps below resolve against.
          case "${{ matrix.os }}" in
            windows) pattern='script/windows/Output/*.exe' ;;
            macos)   pattern='target/*/bundle/osx/*.dmg target/*/*/bundle/osx/*.dmg' ;;
            linux)   pattern='target/*/bundle/linux/*.AppImage target/*/*/bundle/linux/*.AppImage' ;;
          esac
          # shellcheck disable=SC2086
          found=$(ls -1 $pattern 2>/dev/null | head -1 || true)
          if [ -z "$found" ]; then
            echo "::error::no artifact matched $pattern"
            find target script/windows/Output -maxdepth 6 \
              \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) 2>/dev/null || true
            exit 1
          fi
          echo "path=clients/terminal/$found" >> "$GITHUB_OUTPUT"
          echo "Found clients/terminal/$found"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.artifacts.outputs.path }}
          archive: false

      - name: Publish to the release
        # v2.6.2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: ${{ steps.artifacts.outputs.path }}
          fail_on_unmatched_files: true
          # The repository releases several products; the terminal's are never
          # the one GitHub calls "latest".
          make_latest: false
          generate_release_notes: true

      # The symbols of the exact binary in the installer, as a workflow artifact
      # (nobody installing needs them). After the publish step and unable to
      # fail the job, so it can never keep the installer out of the release.
      - name: Keep the Windows symbols
        if: matrix.os == 'windows'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polaris-terminal-pdb-${{ steps.tag.outputs.value }}
          path: |
            ${{ steps.bundle_windows.outputs.pdb_file_path }}
            clients/terminal/target/x86_64-pc-windows-msvc/rlto/*.pdb
          if-no-files-found: warn
          retention-days: 90
