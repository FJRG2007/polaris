version: 2

# Updates arrive as a few grouped pull requests a week instead of one per
# package. Every one goes through Dashboard CI like any other branch (including
# the production-audit gate) and is merged by a person: nothing here merges on
# its own or pushes to main.
#
# Security updates are not on this schedule: GitHub opens them as soon as an
# advisory matches a locked version, grouped into one pull request per
# ecosystem below. They need "Dependabot security updates" switched on in the
# repository's Code security settings.

updates:
  - package-ecosystem: npm
    # The workspace root: one lockfile for every app, package and service.
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Manifests pin exact versions (.npmrc save-exact); keep them exact.
    versioning-strategy: increase
    commit-message:
      prefix: "⬆️ deps"
    labels: [dependencies]
    # A dependency joins the FIRST group whose patterns it matches, so the order
    # below is the policy: what needs reading comes out of the routine group.
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Sign-in, sessions, keys, the MCP surface, outbound fetch, sanitizing and
      # the database drivers that carry credentials: even a minor release here
      # changes what an attacker meets. Its own pull request, read against the
      # changelog, never folded into the routine one.
      auth-and-security:
        applies-to: version-updates
        patterns:
          - "better-auth"
          - "@better-auth/*"
          - "@modelcontextprotocol/*"
          - "fastmcp"
          - "acme-client"
          - "ssh2"
          - "hash-wasm"
          - "aws4fetch"
          - "ipaddr.js"
          - "dompurify"
          - "undici"
          - "pg"
          - "mysql2"
          - "mongodb"
          - "ioredis"
      # The framework and the React it renders with move together.
      framework:
        applies-to: version-updates
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Below 1.0 a minor release is allowed to break (semver 4): these go with
      # the majors' care, not with the routine group. Every direct dependency
      # pinned at 0.x must be listed - scripts/test/dependabot-groups.test.mjs
      # fails when one is missing.
      pre-1.0:
        applies-to: version-updates
        patterns:
          - "@enigmax/primitives"
          - "@mediapipe/selfie_segmentation"
          - "@sapphi-red/web-noise-suppressor"
          - "@univerjs/*"
          - "@xterm/addon-*"
          - "agent-browser"
          - "arkregex"
          - "browser-fs-access"
          - "class-variance-authority"
          - "esbuild"
          - "fuzzy"
          - "iconv-lite"
          - "jotai-scope"
          - "katex"
          - "lucide-react"
          - "sharp"
          - "tunnel-rat"
          - "wxt"
      # Minor and patch releases of everything else, together.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      # Majors need reading a changelog and often a code change; they come in
      # their own pull request so they never hold up the routine one.
      major:
        applies-to: version-updates
        update-types: [major]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: "👷 ci"
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
