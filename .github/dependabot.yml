version: 2

# Updates arrive as a few grouped pull requests a week instead of one per
# package. Every one goes through Dashboard CI like any other branch (including
# the production-audit gate) and is merged by a person: nothing here merges on
# its own or pushes to main.
#
# Security updates are not on this schedule: GitHub opens them as soon as an
# advisory matches a locked version, grouped into one pull request per
# ecosystem below. They need "Dependabot security updates" switched on in the
# repository's Code security settings.

updates:
  - package-ecosystem: npm
    # The workspace root: one lockfile for every app, package and service.
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Manifests pin exact versions (.npmrc save-exact); keep them exact.
    versioning-strategy: increase
    commit-message:
      prefix: "⬆️ deps"
    labels: [dependencies]
    # A dependency joins the FIRST group whose rules it matches; one that matches
    # no group gets a pull request of its own. That is the policy below: only
    # what is safe to read quickly is grouped, and everything that needs its
    # changelog read - every major, a minor below 1.0, a minor of an auth or
    # security library - arrives alone, at most five open at a time.
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Sign-in, sessions, keys, the MCP surface, outbound fetch, sanitizing and
      # the database drivers that carry credentials. Patches together; a minor
      # changes what an attacker meets and comes alone.
      auth-and-security:
        applies-to: version-updates
        update-types: [patch]
        patterns:
          - "better-auth"
          - "@better-auth/*"
          - "@modelcontextprotocol/*"
          - "fastmcp"
          - "acme-client"
          - "ssh2"
          - "hash-wasm"
          - "aws4fetch"
          - "ipaddr.js"
          - "dompurify"
          - "undici"
          - "pg"
          - "mysql2"
          - "mongodb"
          - "ioredis"
      # The framework and the React it renders with move together, at any level:
      # the root's react override follows the root's own react version.
      framework:
        applies-to: version-updates
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Below 1.0 a minor release is allowed to break (semver item 4): agent-browser
      # 0.25 -> 0.38 needs Node 24. Patches together; a minor comes alone. Every
      # direct dependency pinned at 0.x must be listed here and excluded below -
      # scripts/test/dependabot-groups.test.mjs fails otherwise.
      pre-1.0:
        applies-to: version-updates
        update-types: [patch]
        patterns:
          - "@enigmax/primitives"
          - "@mediapipe/selfie_segmentation"
          - "@sapphi-red/web-noise-suppressor"
          - "@univerjs/*"
          - "@xterm/addon-*"
          - "agent-browser"
          - "arkregex"
          - "browser-fs-access"
          - "canvas-roundrect-polyfill"
          - "class-variance-authority"
          - "esbuild"
          - "fuzzy"
          - "iconv-lite"
          - "jotai-scope"
          - "katex"
          - "lucide-react"
          - "sharp"
          - "tunnel-rat"
          - "wxt"
      # Minor and patch releases of everything else, together.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
        exclude-patterns:
          - "better-auth"
          - "@better-auth/*"
          - "@modelcontextprotocol/*"
          - "fastmcp"
          - "acme-client"
          - "ssh2"
          - "hash-wasm"
          - "aws4fetch"
          - "ipaddr.js"
          - "dompurify"
          - "undici"
          - "pg"
          - "mysql2"
          - "mongodb"
          - "ioredis"
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@enigmax/primitives"
          - "@mediapipe/selfie_segmentation"
          - "@sapphi-red/web-noise-suppressor"
          - "@univerjs/*"
          - "@xterm/addon-*"
          - "agent-browser"
          - "arkregex"
          - "browser-fs-access"
          - "canvas-roundrect-polyfill"
          - "class-variance-authority"
          - "esbuild"
          - "fuzzy"
          - "iconv-lite"
          - "jotai-scope"
          - "katex"
          - "lucide-react"
          - "sharp"
          - "tunnel-rat"
          - "wxt"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: "👷 ci"
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
