name: Bug report
description: Something in Polaris does not work as it should.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Polaris runs on very different
        hardware, so please fill in where it runs as accurately as you can.
        Security problems are not reported here: see SECURITY.md.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: >-
            I have searched the existing issues (open and closed) and confirmed this
            is not a duplicate. I understand that knowingly filing duplicates may
            result in a sanction or limits on participating in this repository.
          required: true
        - label: I am running the latest build (Admin > Updates & settings shows "Up to date").
          required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where in Polaris did it happen?
      multiple: true
      options:
        - Install or Update
        - Account, sign-in and security
        - Admin and settings
        - Drive
        - Vault
        - Deploy
        - Servers, Containers and Backups
        - Marketplace and installed apps
        - Runners
        - Agents and Code
        - Databases
        - Tasks
        - Calendar
        - Chat, calls and meetings
        - Mail and Inbox
        - Notes and Office
        - Organizations
        - Watch, Analytics and Firewall
        - Domains and Domain security
        - Places
        - Game servers
        - Browser extension
        - Desktop app
        - MCP server or CLI
        - Other
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Polaris build
      description: Shown in Admin > Updates & settings, under "Running build".
      placeholder: "e.g. 1dc0958"
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: Edition
      description: In the full edition the Update button installs updates; in the limited one it cannot.
      options:
        - Full
        - Limited
        - I don't know
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Where Polaris runs
      description: The host's OS and version, and the hardware.
      placeholder: "e.g. Ubuntu 24.04 on a mini PC / UniFi UNAS Pro / a VPS"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Only if the problem shows in the interface.
      placeholder: "e.g. Chrome 141 on Windows 11 / Safari on iPhone"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug. Screenshots help.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error message or output
      description: Paste any message Polaris showed. Remove addresses, tokens and passwords first. This is formatted automatically; no backticks needed.
      render: shell
    validations:
      required: false
