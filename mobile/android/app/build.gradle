plugins {
    id 'com.android.application'
}

android {
    namespace 'app.polaris.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'app.polaris.mobile'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '0.1.8'
    }

    signingConfigs {
        // Polaris's own release key, from CI only: an update installs over a build only if the key is the same.
        polaris {
            storeFile file(System.getenv('MOBILE_KEYSTORE_PATH') ?: 'unset')
            storePassword System.getenv('MOBILE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('MOBILE_KEY_ALIAS')
            keyPassword System.getenv('MOBILE_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('MOBILE_KEYSTORE_PATH') ? signingConfigs.polaris : signingConfigs.debug
        }
    }

    // F-Droid and reproducible builds: no Google-encrypted dependency report inside the APK or bundle.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebView features newer than the phone's Android: passkeys inside the page, and one cookie jar per Polaris.
    implementation 'androidx.webkit:webkit:1.18.0'
    // Vault autofill: the keyboard chips (inline suggestions) are drawn in the slice format this library defines.
    implementation 'androidx.autofill:autofill:1.1.0'
    // The VPN: the tunnel library the official WireGuard app runs (GoBackend), from WireGuard itself, Apache-2.0.
    implementation 'com.wireguard.android:tunnel:1.0.20260102'

    // Test only (never in the APK): plain JVM tests for the address and the server check, src/test.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
