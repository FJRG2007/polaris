name: Polaris
options:
  bundleIdPrefix: app.polaris
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
targets:
  Polaris:
    type: application
    platform: iOS
    sources:
      - path: Polaris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.polaris.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Push (for calls that ring with the app closed). Read only by a signed build; the simulator build in CI
        # does not sign.
        CODE_SIGN_ENTITLEMENTS: Polaris/Polaris.entitlements
    info:
      path: Polaris/Info.plist
      properties:
        CFBundleDisplayName: Polaris
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # A call that rings with the app closed: iOS wakes the app for a VoIP push and it shows the call screen.
        UIBackgroundModes:
          - voip
        UIAppFonts:
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
        NSCameraUsageDescription: Polaris uses the camera in calls you join.
        NSMicrophoneUsageDescription: Polaris uses the microphone in calls you join.
        NSLocationWhenInUseUsageDescription: Polaris shares your location in a chat only when you send it.
        NSPhotoLibraryAddUsageDescription: Polaris saves the pictures you download to your library.
        NSPhotoLibraryUsageDescription: Polaris shows your recent photos and videos so you can send them in chat.
        # Limited access is managed from chat's + sheet, when the person asks, not by a system alert at launch.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        # A Polaris at home is often reached by plain http on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: Polaris connects to your server on this network.
        # polaris://hosts (a desktop app's servers QR, read with the camera) and polaris://open (a Polaris link
        # followed in Safari) open this app.
        CFBundleURLTypes:
          - CFBundleURLName: app.polaris.mobile
            CFBundleURLSchemes:
              - polaris
