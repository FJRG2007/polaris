<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
        />
        <title>Polaris</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div id="panel" class="panel">
        <button id="close-sheet" class="icon sheet-close" type="button" aria-label="Close" title="Close" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
            </svg>
        </button>
        <header class="brand">
            <img class="mark" src="mark.svg" alt="" />
            <h1 id="title">Open your Polaris</h1>
        </header>
        <nav id="tabs" class="tabs" role="tablist" aria-label="Settings" hidden>
            <button id="tab-servers" type="button" role="tab" aria-selected="true" aria-controls="servers-page">Hosts</button>
            <button id="tab-general" type="button" role="tab" aria-selected="false" aria-controls="general-page">General</button>
            <button id="tab-advanced" type="button" role="tab" aria-selected="false" aria-controls="advanced-page">Advanced</button>
        </nav>
        <p id="failure" class="banner bad" role="alert" hidden></p>
        <section id="servers-page" role="tabpanel">
            <ul id="server-list" class="server-list" aria-label="Your hosts" hidden></ul>
            <button id="show-add" class="ghost" type="button" hidden>Add a host</button>
            <form id="form" novalidate>
                <label class="field-label">
                    <span id="address-label">The address you open Polaris at *</span>
                    <input
                        id="address"
                        name="address"
                        type="url"
                        inputmode="url"
                        autocomplete="url"
                        spellcheck="false"
                        placeholder="https://polaris.example.com"
                        aria-describedby="address-note"
                        autofocus
                    />
                    <span id="address-note" class="hint" aria-live="polite">https://, or http:// for an address on your own network.</span>
                </label>
                <label class="field-label">
                    <span>Name</span>
                    <input id="name" name="name" type="text" spellcheck="false" placeholder="Home, Work..." aria-describedby="name-note" />
                    <span id="name-note" class="hint">Optional. Shown in the list instead of the address.</span>
                </label>
                <div class="row end">
                    <button id="hide-add" class="ghost" type="button" hidden>Cancel</button>
                    <button id="submit" class="primary" type="submit" aria-disabled="true">Open</button>
                </div>
            </form>
        </section>
        <section id="general-page" role="tabpanel" hidden>
            <label class="setting">
                <span class="setting-text">
                    <span class="name">Open with the computer</span>
                    <span class="hint">Polaris opens when you sign in.</span>
                </span>
                <input id="open-at-login" class="switch" type="checkbox" role="switch" />
            </label>
            <label class="setting">
                <span class="setting-text">
                    <span class="name">Start minimized</span>
                    <span class="hint">Opened with the computer, Polaris waits in the tray.</span>
                </span>
                <input id="start-minimized" class="switch" type="checkbox" role="switch" />
            </label>
            <label class="setting">
                <span class="setting-text">
                    <span class="name">Minimize to tray</span>
                    <span class="hint">Closing the window keeps Polaris running for calls and notifications.</span>
                </span>
                <input id="minimize-to-tray" class="switch" type="checkbox" role="switch" />
            </label>
            <div class="row version-row">
                <p id="version" class="hint version"></p>
                <button id="check-updates" class="ghost" type="button">Check for updates</button>
                <button id="restart-update" class="primary" type="button" hidden>Restart now</button>
                <button id="update-page" class="primary" type="button" hidden>Open download page</button>
            </div>
            <p id="update-status" class="hint" role="status" aria-live="polite"></p>
        </section>
        <section id="advanced-page" role="tabpanel" hidden>
            <label class="setting">
                <span class="setting-text">
                    <span class="name">Hardware acceleration</span>
                    <span class="hint">Uses your graphics card to keep Polaris smooth. Turn it off if windows flicker or go blank.</span>
                </span>
                <input id="hardware-acceleration" class="switch" type="checkbox" role="switch" />
            </label>
            <div id="restart-pending" class="row version-row" hidden>
                <p class="hint">Applies when Polaris restarts.</p>
                <button id="restart-pending-now" class="primary" type="button">Restart now</button>
            </div>
        </section>
        </div>
        <dialog id="confirm-remove" aria-labelledby="remove-title" aria-describedby="remove-body">
            <p id="remove-title" class="name"></p>
            <p id="remove-body" class="hint">It only leaves this list. The host and your account stay as they are.</p>
            <div class="row end">
                <button id="remove-cancel" class="ghost" type="button">Cancel</button>
                <!-- enigma: a confirmation button, whose whole job is to be read. -->
                <button id="remove-confirm" class="danger" type="button">Remove</button>
            </div>
        </dialog>
        <dialog id="confirm-restart" aria-labelledby="restart-title" aria-describedby="restart-body">
            <p id="restart-title" class="name">Restart to apply</p>
            <p id="restart-body" class="hint">Polaris uses the new setting once it restarts.</p>
            <p id="restart-failure" class="error" role="alert" hidden></p>
            <div class="row end">
                <button id="restart-later" class="ghost" type="button">Later</button>
                <button id="restart-now" class="primary" type="button">Restart now</button>
            </div>
        </dialog>
        <script src="connect.js"></script>
    </body>
</html>
