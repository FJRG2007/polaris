<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
        />
        <title>Polaris</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <img class="mark" src="mark.svg" alt="" />
        <h1>Open your Polaris</h1>
        <p class="lead">The address you open Polaris at in the browser. This app opens it in a window of its own.</p>
        <p id="failure" class="banner bad" role="alert" hidden></p>
        <section id="saved" class="servers" aria-labelledby="saved-title" hidden>
            <h2 id="saved-title">Your servers</h2>
            <ul id="server-list" class="server-list"></ul>
        </section>
        <form id="form" novalidate>
            <h2 id="add-title" hidden>Add another</h2>
            <label>
                Address *
                <input
                    id="address"
                    name="address"
                    type="url"
                    inputmode="url"
                    autocomplete="url"
                    spellcheck="false"
                    placeholder="https://polaris.example.com"
                    aria-describedby="address-note"
                    autofocus
                />
                <span id="address-note" class="hint" aria-live="polite">https://, or http:// for an address on your own network.</span>
            </label>
            <div class="row end">
                <button id="submit" class="primary" type="submit" aria-disabled="true">Open</button>
            </div>
        </form>
        <script src="connect.js"></script>
    </body>
</html>
