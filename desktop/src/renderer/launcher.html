<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
        />
        <title>Polaris search</title>
        <style>
            :root {
                --bg: #ffffff;
                --text: #16171a;
                --muted: #5f6470;
                --line: #e4e5ea;
                --hover: #f1f0f7;
                --accent: #7632ec;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #16171a;
                    --text: #eceef2;
                    --muted: #9a9fab;
                    --line: #2a2c31;
                    --hover: #24232c;
                    --accent: #a77bf3;
                }
            }
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: var(--bg);
                color: var(--text);
                font: 0.875rem/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            body {
                display: flex;
                flex-direction: column;
                border: 1px solid var(--line);
                box-sizing: border-box;
            }
            #query {
                all: unset;
                box-sizing: border-box;
                width: 100%;
                padding: 1rem 1.125rem;
                font-size: 1.125rem;
                border-bottom: 1px solid var(--line);
            }
            #query::placeholder {
                color: var(--muted);
            }
            #notice {
                margin: 0;
                padding: 0.5rem 1.125rem;
                color: var(--muted);
                font-size: 0.75rem;
                border-bottom: 1px solid var(--line);
            }
            #rows {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                margin: 0;
                padding: 0.375rem;
                list-style: none;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.5rem 0.75rem;
                border-radius: 0.5rem;
                cursor: default;
            }
            .row[aria-selected="true"] {
                background: var(--hover);
            }
            .kind {
                flex: none;
                width: 4.75rem;
                color: var(--accent);
                font-size: 0.6875rem;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }
            .text {
                min-width: 0;
                flex: 1;
            }
            .title,
            .subtitle {
                display: block;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }
            .subtitle {
                color: var(--muted);
                font-size: 0.75rem;
            }
            #empty {
                padding: 1.5rem;
                color: var(--muted);
                text-align: center;
            }
            footer {
                display: flex;
                flex-wrap: wrap;
                gap: 0.25rem 1rem;
                padding: 0.5rem 1.125rem;
                border-top: 1px solid var(--line);
                color: var(--muted);
                font-size: 0.6875rem;
            }
            #clear-clips {
                all: unset;
                margin-left: auto;
                color: var(--accent);
                cursor: pointer;
            }
            #clear-clips:focus-visible {
                outline: 2px solid var(--accent);
            }
        </style>
    </head>
    <body>
        <input
            id="query"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search Polaris, apps and the web, or type a sum"
            aria-label="Search"
            aria-controls="rows"
        />
        <p id="notice" hidden></p>
        <ul id="rows" role="listbox" aria-label="Results"></ul>
        <div id="empty" hidden>Nothing matches.</div>
        <footer>
            <span>Enter to open</span><span>Up and Down to move</span><span>Esc to close</span>
            <button id="clear-clips" type="button" hidden>Clear clipboard history</button>
        </footer>
        <script src="launcher.js"></script>
    </body>
</html>
