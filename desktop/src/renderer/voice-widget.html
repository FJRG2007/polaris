<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"
        />
        <title>Voice - Polaris</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
                font: 0.8125rem/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
                color: #f4f4f6;
                user-select: none;
            }
            /* Discord's overlay voice widget: no panel behind the people, a
               face and a plate that hugs the name, the mute mark in the plate. */
            #panel {
                --face: 2rem;
                --row: 2.25rem;
                --plate: 1.5rem;
                --name: 0.875rem;
                box-sizing: border-box;
                height: 100%;
                padding: 0.25rem;
                border-radius: 0.625rem;
                display: flex;
                flex-direction: column;
            }
            #panel.small {
                --face: 1.375rem;
                --row: 1.625rem;
                --plate: 1.125rem;
                --name: 0.75rem;
            }
            /* Unlocked it is being moved, so it shows where its edges are. */
            #panel.unlocked {
                background: rgba(11, 12, 14, 0.6);
                outline: 0.0625rem dashed rgba(255, 255, 255, 0.35);
                outline-offset: -0.0625rem;
                -webkit-app-region: drag;
            }
            #people {
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            #panel.bottom #people {
                justify-content: flex-end;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 0.25rem;
                height: var(--row);
                min-width: 0;
                flex: none;
            }
            .face {
                position: relative;
                flex: none;
                width: var(--face);
                height: var(--face);
                border-radius: 50%;
                display: grid;
                place-items: center;
                font-size: calc(var(--face) * 0.38);
                font-weight: 600;
                color: #fff;
                box-shadow: 0 0 0 0.125rem transparent;
                transition: box-shadow 80ms linear;
            }
            .face.speaking {
                box-shadow: 0 0 0 0.125rem #23a55a;
            }
            .face img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border-radius: 50%;
                object-fit: cover;
            }
            .badge {
                position: absolute;
                right: -0.125rem;
                bottom: -0.125rem;
                display: flex;
                padding: 0.0625rem;
                border-radius: 0.375rem;
                background: rgba(17, 18, 20, 0.9);
                color: #f23f42;
            }
            .badge svg {
                width: calc(var(--face) * 0.36);
                height: calc(var(--face) * 0.36);
            }
            .badge[hidden],
            .plate[hidden] {
                display: none;
            }
            .plate {
                flex: 0 1 auto;
                min-width: 0;
                display: flex;
                align-items: center;
                gap: 0.25rem;
                height: var(--plate);
                padding: 0 0.375rem;
                border-radius: 0.25rem;
                background: rgba(17, 18, 20, 0.7);
                font-size: var(--name);
                font-weight: 600;
            }
            .name {
                min-width: 0;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }
            .state {
                flex: none;
                display: flex;
                gap: 0.125rem;
                color: #f23f42;
            }
            .state:empty {
                display: none;
            }
            svg {
                width: 0.875rem;
                height: 0.875rem;
                flex: none;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .more {
                height: 1.375rem;
                font-size: 0.75rem;
                text-shadow: 0 0.0625rem 0.125rem rgba(0, 0, 0, 0.9);
            }
            #controls {
                display: flex;
                align-items: center;
                gap: 0.375rem;
                height: 2.75rem;
                padding-top: 0.375rem;
                box-sizing: border-box;
            }
            #controls[hidden] {
                display: none;
            }
            button {
                -webkit-app-region: no-drag;
                display: grid;
                place-items: center;
                width: 2rem;
                height: 2rem;
                border: 0;
                border-radius: 0.5rem;
                background: rgba(255, 255, 255, 0.12);
                color: #f4f4f6;
                cursor: pointer;
            }
            button:hover {
                background: rgba(255, 255, 255, 0.22);
            }
            button.on {
                color: #ed4245;
            }
            button.leave {
                background: #da373c;
            }
            button svg {
                width: 1rem;
                height: 1rem;
            }
            .hint {
                flex: 1 1 auto;
                min-width: 0;
                text-align: right;
                font-size: 0.6875rem;
                opacity: 0.7;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }
        </style>
    </head>
    <body>
        <div id="panel">
            <div id="people"></div>
            <div id="controls" hidden>
                <button id="mic" type="button"></button>
                <button id="deafen" type="button"></button>
                <button id="leave" class="leave" type="button"></button>
                <span id="lock-hint" class="hint"></span>
            </div>
        </div>
        <script src="voice-widget.js"></script>
    </body>
</html>
