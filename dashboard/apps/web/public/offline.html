<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Polaris is not reachable</title>
        <style>
            :root {
                color-scheme: dark light;
                --bg: #0b0c0e;
                --fg: #f3f4f6;
                --muted: #a0a5b1;
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #f6f6f9;
                    --fg: #181b25;
                    --muted: #5c6170;
                }
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding-inline: 16px;
                background: var(--bg);
                color: var(--fg);
                font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            main {
                max-width: 26rem;
                text-align: center;
            }
            h1 {
                font-size: 1.15rem;
                margin: 0 0 0.5rem;
            }
            p {
                margin: 0 0 1.25rem;
                color: var(--muted);
            }
            a {
                color: var(--fg);
            }
            #local {
                margin: 1.25rem 0 0;
            }
            button {
                font: inherit;
                padding: 0.5rem 1rem;
                border-radius: 6px;
                border: 0;
                background: var(--fg);
                color: var(--bg);
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Polaris is not reachable</h1>
            <p>This device cannot reach it right now. Check that you are online and that the machine running Polaris is on.</p>
            <button type="button" onclick="location.reload()">Try again</button>
            <p id="local" hidden><a>Open on your network</a></p>
        </main>
        <script>
            // Written by lib/local-address.ts while this address worked.
            try {
                var held = JSON.parse(localStorage.getItem("polaris.instance"));
                var local = held.record.addresses.filter(function (address) {
                    return /^https:\/\/([^/]+\.local|10\.[\d.]+|192\.168\.[\d.]+|172\.(1[6-9]|2\d|3[01])\.[\d.]+)(:\d+)?$/.test(address);
                })[0];
                if (local) {
                    document.querySelector("#local a").href = local;
                    document.getElementById("local").hidden = false;
                }
            } catch (error) {
                // Nothing remembered: the page stands as it is.
            }
        </script>
    </body>
</html>
