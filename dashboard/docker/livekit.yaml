# The call server Polaris ships with.
#
# Calls used to need somebody to go and set this up: until they did, two people
# on different networks could not hear each other and what the screen told them
# was to read the admin settings. It starts with the stack now, so a fresh
# install has working calls and nobody configures anything.
#
# The keys are not here. They are handed over as LIVEKIT_KEYS by the compose
# file, which reads them from .env, so the one secret in this setup lives in the
# one place the other secrets live and never in a file tracked by git.

port: 7880

rtc:
  # One TCP and one UDP port rather than the ten-thousand-port range LiveKit
  # defaults to. A range that size is a nuisance to publish through Docker, a
  # worse one to open on a router, and a single port carries every call this is
  # ever going to hold.
  tcp_port: 7881
  udp_port: 7882

  # What address to hand browsers as the place to send media.
  #
  # Discovery is deliberately off. Left on, LiveKit finds its public address by
  # asking a STUN server it has hardcoded - Google's - which is exactly the
  # third-party dependency this deployment does not want. So it advertises the
  # address it can see, which is correct on one network and wrong past it.
  #
  # Calling across the internet: uncomment node_ip and put this machine's public
  # address there, then publish 7880, 7881 and 7882 on the router. Without it a
  # browser on another network is told to send its audio somewhere that means
  # nothing outside this building, and the call connects to silence.
  use_external_ip: false
  # node_ip: 203.0.113.10

# The relay, for the networks that refuse a direct path.
#
# A symmetric NAT hands out a different address per destination, so there is no
# single address to give the other end and no direct path exists to find. The
# only way through is for something both sides CAN reach to forward the media,
# and this is that. It costs nothing until it is needed: a call that finds a
# direct path never touches it.
turn:
  enabled: true
  udp_port: 3478
  # TLS is terminated at the edge, not here. A TURN listener holding its own
  # certificate would be a second place certificates have to be kept fresh.
  tls_port: 0

logging:
  level: info
