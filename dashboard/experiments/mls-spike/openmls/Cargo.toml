[package]
name = "openmls-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: never a member of the repository's Cargo workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
web-time = "1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
openmls = { version = "=0.9.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
