org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=false

# The oldest release the plugin is compiled against, which is also the oldest the
# dashboard offers it on (PLUGIN_SINCE in apps/web/src/lib/apps/minecraft/polaris-login.ts).
# 1.20.5 is where Minecraft moved to Java 21, which this jar is built for.
spigot_api_version=1.20.6-R0.1-SNAPSHOT
# What plugin.yml declares; the server refuses a plugin that names a newer one.
api_version=1.20
log4j_version=2.22.1
annotations_version=24.1.0
spotbugs_annotations_version=4.9.3

mod_version=0.1.0
