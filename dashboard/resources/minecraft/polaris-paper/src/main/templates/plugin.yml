name: Polaris
version: "${version}"
main: polaris.minecraft.PolarisPlugin
api-version: "${api_version}"
description: Polaris on this server - the login it keeps players' passwords for, and the server's own sounds.
commands:
  register:
    description: Choose a password for this server.
    usage: /register <password> <password>
  login:
    description: Log in with your password.
    usage: /login <password>
  changepassword:
    description: Change your password.
    usage: /changepassword <current> <new>
  polaris:
    description: For Polaris itself, from the console. Answers one line of JSON.
    usage: /polaris <sounds <status|refresh>|caps|respawn <set|list|clear> <key> ...>
    permission: polaris.console
permissions:
  polaris.console:
    description: Run Polaris's own console commands.
    default: op
