// Polaris login for NeoForge. Built inside the dashboard image (see
// docker/Dockerfile), which serves the jar to the servers that switch it on.
//
// Compiled against NeoForge and nothing else: the mod talks to Polaris with the
// JDK's own HTTP client and the Gson Minecraft already ships, so the jar carries no
// dependency a server would have to resolve.
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = 'polaris.minecraft'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Werror'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
// The HTTP client and the environment reader, shared with the Paper plugin.
sourceSets.main.java.srcDir '../polaris-common/src/main/java'
