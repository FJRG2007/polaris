// Polaris login for NeoForge. Built inside the dashboard image (see
// docker/Dockerfile), which serves the jar to the servers that switch it on.
//
// Compiled against NeoForge and nothing else: the mod talks to Polaris with the
// JDK's own HTTP client and the Gson Minecraft already ships, so the jar carries no
// dependency a server would have to resolve.
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = 'polaris.minecraft'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Werror'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
// The HTTP client and the environment reader, shared with the Paper plugin.
sourceSets.main.java.srcDir '../polaris-common/src/main/java'
// Chat moderation, shared with the anti-cheat plugin.
sourceSets.main.java.srcDir '../polaris-common/src/chat/java'

// The anti-cheat engine, nested as its own mod (NeoForge's jar-in-jar), so a server
// that has this mod gets it without a second download. It is GPL-3.0 and built from
// resources/minecraft/polaris-anticheat (its `neoforge` module); the image passes its
// path, and the version is read from the engine's own metadata. A build without it is
// the login mod alone.
def anticheatJar = findProperty('anticheat_jar')
if (anticheatJar) {
    def engine = file(anticheatJar)
    def engineVersion = providers.provider {
        def toml = zipTree(engine).matching { include 'META-INF/neoforge.mods.toml' }.singleFile.text
        def found = (toml =~ /(?m)^version\s*=\s*"([^"]+)"/)
        if (!found.find()) throw new GradleException("${engine} names no version")
        found.group(1)
    }
    def nestedName = 'polaris-anticheat-neoforge.jar'
    var jarJarMetadata = tasks.register('anticheatJarJarMetadata') {
        def out = layout.buildDirectory.file('generated/anticheat-jarjar/META-INF/jarjar/metadata.json')
        inputs.file(engine)
        outputs.file(out)
        doLast {
            def version = engineVersion.get()
            def metadata = [jars: [[
                    identifier : [group: 'polaris.minecraft', artifact: 'polaris-anticheat-neoforge'],
                    version    : [range: "[${version},)".toString(), artifactVersion: version],
                    path       : "META-INF/jarjar/${nestedName}".toString(),
                    isObfuscated: false
            ]]]
            out.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n'
        }
    }
    tasks.named('jar', Jar) {
        dependsOn jarJarMetadata
        inputs.file(engine)
        from(layout.buildDirectory.dir('generated/anticheat-jarjar'))
        from(engine) {
            into 'META-INF/jarjar'
            rename { nestedName }
        }
    }
}
