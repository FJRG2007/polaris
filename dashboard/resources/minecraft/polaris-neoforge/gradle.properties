org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

# The release this build is for. The loader refuses the jar on any other, and the
# dashboard only offers it where this matches (MOD_BUILDS in
# apps/web/src/lib/apps/minecraft/polaris-login.ts).
minecraft_version_range=[1.21.4]
# What it is compiled against, and the oldest NeoForge it is declared to run on.
# The range is the whole 21.4 line rather than this exact build: a server on an
# earlier 21.4 NeoForge would otherwise refuse to start over a version number.
neo_version=21.4.157
neo_version_range=[21.4,)

mod_id=polaris
mod_version=0.1.0
