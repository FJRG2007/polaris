[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Polaris"
description='''
Asks every player for a password kept by the Polaris that manages this server.
Server-side only: players join with an unmodified client.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="SERVER"
