[package]
name = "polaris-core-node"
version = "0.1.0"
description = "Node binding of polaris-core (napi-rs): the dashboard server and Electron main load it through @polaris/core-rs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
polaris-core = { path = "../polaris-core", features = ["opaque"] }
napi = { version = "=3.16.2", default-features = false, features = ["napi6"] }
napi-derive = { version = "=3.7.0", default-features = false }
# USB presence for the desktop's device add-ons (src/usb.rs): the same nusb as
# crates/polaris-stream100, ids only, nothing opened.
nusb = "=0.2.9"
futures-core = "=0.3.34"
serde_json = { workspace = true }

[build-dependencies]
napi-build = "=2.6.0"
