[package]
name = "polaris-tunnel"
version = "0.1.1"
description = "Polaris' tunnel daemon: userspace WireGuard with TCP and native UDP forwards, no TUN device and no privileges."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "polaris-tunnel"
path = "src/main.rs"

[dependencies]
boringtun = { version = "0.7.1", default-features = false }
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-reno"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros", "signal", "io-util"] }
base64 = "0.22.1"

[dev-dependencies]
proptest = "1.7.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
