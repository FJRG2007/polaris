[package]
name = "polaris-core-wasm"
version = "0.1.0"
description = "WebAssembly binding of polaris-core (wasm-bindgen): browsers, the extension and the mobile WebViews load it through @polaris/core-rs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
polaris-core = { path = "../polaris-core", default-features = false }
# Must equal the installed wasm-bindgen-cli version exactly.
wasm-bindgen = { version = "=0.2.130", default-features = false, features = ["std"] }
js-sys = { version = "=0.3.107", default-features = false, features = ["std"] }

[features]
default = []
# The MLS group engine (polaris_core::mls). Built as its own lazily loaded
# module (wasm-mls/ in @polaris/core-rs), so a page that never opens an
# encrypted chat does not download it.
mls = ["polaris-core/mls"]
