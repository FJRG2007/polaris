[package]
name = "polaris-stream100-node"
version = "0.1.0"
description = "Node binding of polaris-stream100 (napi-rs): the Hercules Stream 100 add-on loads it in its own process, only while the controller is plugged in."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Its own binary, not part of polaris-core-node: a machine without the
# controller never downloads or loads any of it.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
polaris-stream100 = { path = "../polaris-stream100", features = ["native"] }
serde = { workspace = true }
serde_json = { workspace = true }
napi = { version = "=3.16.2", default-features = false, features = ["napi6"] }
napi-derive = { version = "=3.7.0", default-features = false }

[build-dependencies]
napi-build = "=2.6.0"
