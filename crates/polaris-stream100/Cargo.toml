[package]
name = "polaris-stream100"
version = "0.1.23"
description = "Polaris' driver for the Hercules Stream 100: its USB protocol, knob handling, display frames and per-app audio categories (docs/devices/hercules-stream100.md)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

# The protocol, the knob engine, the display frames and the audio categories
# are pure and always built. Talking to the device is the `usb` feature, so a
# machine without the controller (and every CI job) never links a USB stack.
[features]
default = []
usb = ["dep:nusb"]
# The operating system's per-app volume, the controller's input reports (the
# HID API on Windows, `usb` elsewhere) and, on Windows, who holds the device.
# Built only into the plugin's own binding, never into anything a machine
# without the controller loads.
native = [
    "usb",
    "dep:windows",
    "dep:pulseaudio",
    "dep:zbus",
    "dep:libusb1-sys",
    "dep:libc",
]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
nusb = { version = "0.2.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Usb",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Media_Control",
] }

[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = { version = "=0.3.2", optional = true }
# MPRIS on the session bus, for what is playing (pure Rust, no libdbus).
zbus = { version = "=5.19.0", optional = true, default-features = false, features = [
    "async-io",
    "blocking-api",
] }

# libusb, built from its vendored source into the module (nothing to install
# on the machine): the isochronous OUT endpoint the keep-alive and the screen
# use is not in `nusb` 0.2, and libusb is what every Linux and macOS driver
# for this controller already talks through.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libusb1-sys = { version = "=0.7.0", optional = true, features = ["vendored"] }
libc = { version = "0.2", optional = true }
