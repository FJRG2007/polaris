[package]
name = "polaris-stream100"
version = "0.1.0"
description = "Polaris' driver for the Hercules Stream 100: its USB protocol, knob handling, display frames and per-app audio categories (docs/devices/hercules-stream100.md)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

# The protocol, the knob engine, the display frames and the audio categories
# are pure and always built. Talking to the device is the `usb` feature, so a
# machine without the controller (and every CI job) never links a USB stack.
[features]
default = []
usb = ["dep:nusb"]
# The operating system's per-app volume and, on Windows, who holds the device.
# Built only into the add-on's own binding, never into anything a machine
# without the controller loads.
native = ["dep:windows", "dep:pulseaudio"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
nusb = { version = "0.2.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_DeviceAndDriverInstallation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = { version = "=0.3.2", optional = true }
