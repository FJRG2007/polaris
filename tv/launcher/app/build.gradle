plugins {
    id 'com.android.application'
}

// homeCategory=false builds the Home key edition (polaris-tv-home-key.apk) for firmware that uninstalls, at
// every boot, any app that declares the HOME category (NES middleware's com.nes.coreservice: TiVo Stream 4K, Nokia
// Streaming Box 8000; tv/examples/tivo-stream-4k/README.md). MainActivity then has no HOME filter and HomeKeyService
// opens it on the remote's Home key. Same applicationId and key, so either edition installs over the other.
def homeCategory = providers.gradleProperty('homeCategory').getOrElse('true').toBoolean()

android {
    namespace 'app.polaris.tv'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('app.polaris.tv')
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName '3.10'
        manifestPlaceholders = [homeCategory: homeCategory ? 'android.intent.category.HOME' : 'app.polaris.tv.category.HOME_KEY']
        buildConfigField 'boolean', 'HOME_CATEGORY', String.valueOf(homeCategory)
    }

    signingConfigs {
        // Polaris's own release key, from CI only: updates install over a build only if the key is the same.
        polaris {
            storeFile file(System.getenv('TV_KEYSTORE_PATH') ?: 'unset')
            storePassword System.getenv('TV_KEYSTORE_PASSWORD')
            keyAlias System.getenv('TV_KEY_ALIAS')
            keyPassword System.getenv('TV_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig System.getenv('TV_KEYSTORE_PATH') ? signingConfigs.polaris : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // The code a phone scans to connect this TV to a Polaris. R8 keeps only the QR writer.
    implementation 'com.google.zxing:core:3.5.3'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
